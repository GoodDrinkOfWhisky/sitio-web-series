<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÓMICS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:20px}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:2px solid #fff;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.top-bar h1{letter-spacing:2px}
.btn{border:2px solid #fff;background:#000;color:#fff;padding:8px 16px;cursor:pointer;font-weight:bold;border-radius:6px;transition:.2s}
.btn:hover{background:#fff;color:#000;box-shadow:0 0 12px #fff}
.btn-red{border-color:#ff4444;color:#ff4444}
.btn-red:hover{background:#ff4444;color:#fff}
.btn-green{border-color:#44ff44;color:#44ff44}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.comic-card{border:2px solid #fff;border-radius:10px;overflow:hidden;background:#0a0a0a;transition:.2s;position:relative}
.comic-card:hover{transform:scale(1.03);box-shadow:0 0 15px #fff}
.comic-card img{width:100%;height:280px;object-fit:cover;display:block;cursor:pointer}
.comic-info{padding:10px}
.comic-info h3{font-size:16px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comic-actions{display:flex;gap:6px;flex-wrap:wrap}
.comic-actions button{flex:1;font-size:12px;padding:6px}

/* Lector */
#lector{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;flex-direction:column}
#lector-head{height:50px;background:#000;border-bottom:2px solid #fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;flex-shrink:0}
#lector-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative;background:#111}
#lector-body img{max-width:100%;max-height:100%;object-fit:contain}
#lector-controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
#lector-x{position:absolute;top:15px;right:15px;z-index:10;font-size:18px;padding:10px 18px}

/* Modal */
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100000;align-items:center;justify-content:center;padding:20px}
#modal-box{background:#111;border:2px solid #fff;border-radius:10px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
#modal-box input{width:100%;padding:10px;margin:8px 0;background:#000;border:1px solid #fff;color:#fff;border-radius:4px}
#modal-box label{font-size:12px;color:#aaa;margin-top:10px;display:block}
.pag-preview{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pag-preview img{width:60px;height:60px;object-fit:cover;border:1px solid #fff}
</style>
</head>
<body>

<div class="top-bar">
  <h1>CÓMICS</h1>
  <div id="adminArea">
    <button class="btn" onclick="loginAdmin()">ADMIN</button>
  </div>
</div>

<div id="grid"></div>

<!-- LECTOR SOLO CON X -->
<div id="lector">
  <div id="lector-head">
    <span id="lector-title" style="font-weight:bold"></span>
    <button class="btn" onclick="cerrarLector()">X</button>
  </div>
  <div id="lector-body">
    <button class="btn" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:5;padding:15px" onclick="cambiarPag(-1)">‹</button>
    <img id="lector-img" src="">
    <button class="btn" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:5;padding:15px" onclick="cambiarPag(1)">›</button>
    <div id="lector-controls">
      <span id="pag-info" style="background:#000;border:1px solid #fff;padding:6px 12px;border-radius:4px;font-size:12px"></span>
    </div>
  </div>
</div>

<!-- MODAL AGREGAR/EDITAR -->
<div id="modal">
  <div id="modal-box">
    <h3 id="modal-title">Agregar Cómic</h3>
    <label>Título</label>
    <input id="inp-titulo" placeholder="Ej: Whiskey #1">
    <label>Portada (URL o sube archivo)</label>
    <input type="file" id="inp-portada-file" accept="image/*">
    <input id="inp-portada-url" placeholder="https://... o deja vacío si subiste archivo">
    <label>Páginas (puedes subir varias)</label>
    <input type="file" id="inp-paginas-file" accept="image/*" multiple>
    <div class="pag-preview" id="pag-preview"></div>
    <label>O pega URLs de páginas separadas por coma</label>
    <input id="inp-paginas-url" placeholder="url1, url2, url3">
    <div style="display:flex;gap:10px;margin-top:15px">
      <button class="btn btn-green" onclick="guardarComic()">GUARDAR</button>
      <button class="btn" onclick="cerrarModal()">CANCELAR</button>
    </div>
  </div>
</div>

<script>
const ADMIN_EMAIL = "lxvtorres@gmail.com";
const ADMIN_PASS = "whiskey";
let comics = JSON.parse(localStorage.getItem("whiskey_comics_final") || "[]");
let admin = localStorage.getItem("whiskey_admin") === "true";
let paginasTemp = [];
let portadaTemp = "";
let editId = null;
let lectorComic = null;
let paginaActual = 0;

function render(){
  const grid = document.getElementById("grid");
  const adminArea = document.getElementById("adminArea");

  if(admin){
    adminArea.innerHTML = `<span style="font-size:12px;color:#44ff44;margin-right:10px">✓ ${ADMIN_EMAIL}</span>
    <button class="btn btn-green" onclick="abrirModal()">+ AGREGAR</button>
    <button class="btn" onclick="logoutAdmin()">SALIR</button>`;
  }else{
    adminArea.innerHTML = `<button class="btn" onclick="loginAdmin()">ADMIN</button>`;
  }

  if(comics.length===0){
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:40px;color:#888">No hay cómics aún. ${admin?'Agrega el primero.':'Espera a que el admin suba.'}</p>`;
    return;
  }
  grid.innerHTML = comics.map(c=>`
    <div class="comic-card">
      <img src="${c.portada}" onclick="abrirLector('${c.id}')">
      <div class="comic-info">
        <h3>${c.titulo}</h3>
        <div style="font-size:11px;color:#888;margin-bottom:8px">${c.paginas.length} páginas</div>
        ${admin?`<div class="comic-actions">
          <button class="btn" onclick="editarComic('${c.id}')">EDITAR</button>
          <button class="btn btn-red" onclick="borrarComic('${c.id}')">BORRAR</button>
        </div>`:`<button class="btn" style="width:100%" onclick="abrirLector('${c.id}')">LEER</button>`}
      </div>
    </div>
  `).join("");
}

window.loginAdmin = ()=>{
  let email = prompt("Correo admin:");
  if(!email) return;
  if(email.trim().toLowerCase()!== ADMIN_EMAIL){
    alert("No autorizado. Solo "+ADMIN_EMAIL);
    return;
  }
  let pass = prompt("Contraseña:");
  if(pass!== ADMIN_PASS){
    alert("Contraseña incorrecta. Es: whiskey");
    return;
  }
  admin = true;
  localStorage.setItem("whiskey_admin","true");
  render();
}

window.logoutAdmin = ()=>{
  admin=false;
  localStorage.removeItem("whiskey_admin");
  render();
}

window.abrirModal = ()=>{
  editId=null;
  document.getElementById("modal-title").innerText="Agregar Cómic";
  document.getElementById("inp-titulo").value="";
  document.getElementById("inp-portada-url").value="";
  document.getElementById("inp-paginas-url").value="";
  document.getElementById("inp-portada-file").value="";
  document.getElementById("inp-paginas-file").value="";
  portadaTemp=""; paginasTemp=[];
  document.getElementById("pag-preview").innerHTML="";
  document.getElementById("modal").style.display="flex";
}

window.cerrarModal = ()=>{ document.getElementById("modal").style.display="none"; }

window.editarComic = (id)=>{
  let c = comics.find(x=>x.id===id);
  if(!c) return;
  editId=id;
  document.getElementById("modal-title").innerText="Editar Cómic";
  document.getElementById("inp-titulo").value=c.titulo;
  document.getElementById("inp-portada-url").value=c.portada;
  portadaTemp=c.portada;
  paginasTemp=[...c.paginas];
  renderPreview();
  document.getElementById("modal").style.display="flex";
}

window.borrarComic = (id)=>{
  if(!confirm("¿Borrar este cómic?")) return;
  comics = comics.filter(c=>c.id!==id);
  guardar();
}

function renderPreview(){
  document.getElementById("pag-preview").innerHTML = paginasTemp.map((src,i)=>`<div style="position:relative"><img src="${src}"><button onclick="paginasTemp.splice(${i},1);renderPreview()" style="position:absolute;top:-5px;right:-5px;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer">x</button></div>`).join("");
}

document.getElementById("inp-portada-file").addEventListener("change",function(){
  let f=this.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=e=>{ portadaTemp=e.target.result; }; r.readAsDataURL(f);
});

document.getElementById("inp-paginas-file").addEventListener("change",function(){
  for(let f of this.files){
    let r=new FileReader();
    r.onload=e=>{ paginasTemp.push(e.target.result); renderPreview(); };
    r.readAsDataURL(f);
  }
});

window.guardarComic = ()=>{
  let titulo = document.getElementById("inp-titulo").value.trim();
  let portadaUrl = document.getElementById("inp-portada-url").value.trim();
  let paginasUrl = document.getElementById("inp-paginas-url").value.trim();

  if(!titulo){ alert("Pon título"); return; }

  let portadaFinal = portadaTemp || portadaUrl;
  if(!portadaFinal){ alert("Pon portada"); return; }

  if(paginasUrl){
    let urls = paginasUrl.split(",").map(s=>s.trim()).filter(s=>s);
    paginasTemp = paginasTemp.concat(urls);
  }
  if(paginasTemp.length===0){ alert("Agrega al menos 1 página"); return; }

  if(editId){
    let idx=comics.findIndex(c=>c.id===editId);
    comics[idx].titulo=titulo; comics[idx].portada=portadaFinal; comics[idx].paginas=[...paginasTemp];
  }else{
    comics.push({id:Date.now().toString(), titulo, portada:portadaFinal, paginas:[...paginasTemp]});
  }
  guardar();
  cerrarModal();
}

function guardar(){
  localStorage.setItem("whiskey_comics_final", JSON.stringify(comics));
  render();
}

// Lector
window.abrirLector = (id)=>{
  lectorComic = comics.find(c=>c.id===id);
  if(!lectorComic) return;
  paginaActual=0;
  document.getElementById("lector-title").innerText=lectorComic.titulo;
  document.getElementById("lector").style.display="flex";
  mostrarPag();
}
window.cerrarLector = ()=>{ document.getElementById("lector").style.display="none"; }
function mostrarPag(){
  document.getElementById("lector-img").src=lectorComic.paginas[paginaActual];
  document.getElementById("pag-info").innerText=(paginaActual+1)+" / "+lectorComic.paginas.length;
}
window.cambiarPag = (d)=>{
  paginaActual+=d;
  if(paginaActual<0) paginaActual=lectorComic.paginas.length-1;
  if(paginaActual>=lectorComic.paginas.length) paginaActual=0;
  mostrarPag();
}

// Swipe móvil
let sx=0;
document.getElementById("lector-body").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById("lector-body").addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50){ if(dx>0) cambiarPag(-1); else cambiarPag(1); }
});

render();
</script>
</body>
</html>

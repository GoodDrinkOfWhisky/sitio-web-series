<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómics</title>
<style>
  /* --- BOTÓN X ÚNICO --- */
  .close-btn {
    position: fixed;
    top: 20px;
    right: 25px;
    font-size: 35px;
    text-decoration: none;
    color: white;
    background: rgba(0,0,0,0.6);
    width: 45px;
    height: 45px;
    text-align: center;
    line-height: 45px;
    border-radius: 50%;
    z-index: 9999;
  }
  .close-btn:hover { background: red; }
</style>
</head>
<body>

<!-- ESTA ES LA RUTA CORRECTA A TU PRINCIPAL -->
<a href="../index.html" class="close-btn">X</a>

<div id="comics-content">
  <!-- AQUÍ VA TODO TU CONTENIDO DE CÓMICS, NO LO BORRES -->
  <h1>COMICS</h1>
  <div id="lista-comics"></div>
</div>

<script>
// --- SOLO TU CORREO PUEDE EDITAR ---
const ADMIN_EMAIL = "lxvtorres@gmail.com";
const userEmail = localStorage.getItem("userEmail") || ""; // o como tengas tu login

function puedeEditar() {
  return userEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

// Ejemplo: oculta botones de editar si no eres tú
document.addEventListener("DOMContentLoaded", () => {
  if (!puedeEditar()) {
    const editBtns = document.querySelectorAll(".btn-editar, .btn-borrar, .btn-agregar");
    editBtns.forEach(b => b.style.display = "none");
  }
});
</script>

</body>
</html>

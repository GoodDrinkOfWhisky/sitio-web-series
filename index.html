<script>
const MAC_PASS="admin123";
const LINK_KEY="xbox_links_v1";
let links = JSON.parse(localStorage.getItem(LINK_KEY) || '{"tiktok":"","discord":"","youtube":"","insta":""}');
let macEditable=false;
function abrirMac(){ document.getElementById("mac-wrap").style.display="block"; }
function cerrarMac(){ document.getElementById("mac-wrap").style.display="none"; }
function openLink(t){ if(macEditable) return; const u=links[t]; if(!u) return alert("Sin link para "+t); window.open(u,"_blank"); }
function toggleEdit(){
  const panel=document.getElementById("mac-edit-panel"), btn=document.getElementById("mac-edit-btn");
  if(!macEditable){
    if(prompt("Pass:")!==MAC_PASS) return;
    macEditable=true; panel.style.display="block";
    document.getElementById("inp-tiktok").value=links.tiktok;
    document.getElementById("inp-discord").value=links.discord;
    document.getElementById("inp-youtube").value=links.youtube;
    document.getElementById("inp-insta").value=links.insta;
    btn.textContent="GUARDAR"; btn.style.color="white"; btn.style.borderColor="white";
  }else{
    links.tiktok=document.getElementById("inp-tiktok").value.trim();
    links.discord=document.getElementById("inp-discord").value.trim();
    links.youtube=document.getElementById("inp-youtube").value.trim();
    links.insta=document.getElementById("inp-insta").value.trim();
    localStorage.setItem(LINK_KEY, JSON.stringify(links));
    macEditable=false; panel.style.display="none"; btn.textContent="EDITAR"; btn.style.color=""; btn.style.borderColor=""; alert("Guardado!");
  }
}
(function(){
  const bar=document.getElementById("mac-bar"), wrap=document.getElementById("mac-wrap");
  let down=false,sx,sy,il,it;
  bar.addEventListener("mousedown",e=>{down=true;const r=wrap.getBoundingClientRect();il=r.left;it=r.top;sx=e.clientX;sy=e.clientY;});
  window.addEventListener("mousemove",e=>{if(!down)return;wrap.style.left=(il+e.clientX-sx+wrap.offsetWidth/2)+"px";wrap.style.top=(it+e.clientY-sy+wrap.offsetHeight/2)+"px";});
  window.addEventListener("mouseup",()=>down=false);
})();
</script>

<script>
(function(){
  const PASS2 = "admin123";
  const VIDEO_QUIETA = "RENYA.mp4";
  const VIDEO_HABLANDO = "RENYATALKS.mp4";

  let lista = JSON.parse(localStorage.getItem("frases") || '["Hola!, mucho gusto estoy aqui para brindarte consejos basicos","Mira la galeria","Esta diseñada para los fanarts","tambien puedes apoyar el contenido al visitar las demas redes sociales, los links se encuentran abajo","este sitio se encuentra en una fase muy temprana asi que no hay mucho que hacer por ahora lo siento..."]');
  let pos=0, busy=false;

  const elIdle = document.getElementById("pj-video-idle");
  const elTalk = document.getElementById("pj-video-talk");
  const elGlobo = document.getElementById("pj-globo");

  elIdle.src = VIDEO_QUIETA;
  elTalk.src = VIDEO_HABLANDO;
  elIdle.load(); elTalk.load();
  elIdle.play().catch(()=>{});

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beepOriginal(){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='square';
    o.frequency.value = 185 + Math.random()*12;
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.13);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.13);
  }

  function ajustarFuente(t){
    let s=18; if(t.length>70)s=15; if(t.length>130)s=13; if(t.length>200)s=11.5;
    elGlobo.style.fontSize=s+"px";
  }

  function escribir(texto){
    if(busy) return;
    busy=true;
    if(audioCtx.state==='suspended') audioCtx.resume();
    elIdle.style.display="none"; elIdle.pause();
    elTalk.style.display="block"; elTalk.currentTime=0; elTalk.play().catch(()=>{});
    elGlobo.style.display="block"; elGlobo.textContent=""; ajustarFuente(texto);
    let i=0;
    let inter=setInterval(()=>{
      elGlobo.textContent+=texto[i]||"";
      if(texto[i] && texto[i]!=" " && i%2==0) beepOriginal();
      i++;
      if(i>=texto.length){
        clearInterval(inter);
        elTalk.pause(); elTalk.style.display="none";
        elIdle.style.display="block"; elIdle.play().catch(()=>{});
        setTimeout(()=>{ elGlobo.style.display="none"; busy=false; },2500);
      }
    },28);
  }

  function siguienteFrase(){
    if(busy ||!lista.length) return;
    escribir(lista[pos]);
    pos=(pos+1)%lista.length;
  }
  elIdle.addEventListener("click", siguienteFrase);
  elTalk.addEventListener("click", siguienteFrase);

  let t=null;
  function startHold(){ t=setTimeout(openAdmin,1200); }
  function stopHold(){ clearTimeout(t); }
  elIdle.addEventListener("mousedown",startHold);
  elIdle.addEventListener("mouseup",stopHold);
  elIdle.addEventListener("mouseleave",stopHold);
  elIdle.addEventListener("touchstart",startHold,{passive:true});
  elIdle.addEventListener("touchend",stopHold);

  function openAdmin(){
    if(prompt("Pass:")!==PASS2) return;
    let txt=prompt("Actuales:\n"+lista.join("\n")+"\n\nNuevo texto, vacio borra ultimo:");
    if(txt===null) return; txt=txt.trim();
    if(txt==="") lista.pop(); else lista.push(txt);
    localStorage.setItem("frases",JSON.stringify(lista));
  }
})();
</script>

<script>
let db, comicsLista=[], carpetaHandle=null;
function abrirDB(){return new Promise(r=>{let q=indexedDB.open("comicsDB_v2",2);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("comics")) d.createObjectStore("comics",{keyPath:"id",autoIncrement:true});if(!d.objectStoreNames.contains("config")) d.createObjectStore("config",{keyPath:"k"})};q.onsuccess=e=>{db=e.target.result;r()}})}
async function cargarComics(){if(!db) await abrirDB();return new Promise(r=>{let t=db.transaction("comics","readonly").objectStore("comics").getAll();t.onsuccess=()=>{comicsLista=t.result;r()}})}
async function guardarEnDB(o){return new Promise(r=>{let t=db.transaction("comics","readwrite").objectStore("comics").put(o);t.onsuccess=()=>r(t.result)})}
async function borrarEnDB(id){return new Promise(r=>{let t=db.transaction("comics","readwrite").objectStore("comics").delete(id);t.onsuccess=()=>r()})}
async function guardarConfig(k,v){return new Promise(r=>{let t=db.transaction("config","readwrite").objectStore("config").put({k,v});t.onsuccess=()=>r()})}
async function cargarConfig(k){return new Promise(r=>{let t=db.transaction("config","readonly").objectStore("config").get(k);t.onsuccess=()=>r(t.result?.v||null)})}

 else {var h='<div class="galeria-paginas">';for(var i=0;i<tempPaginas.length;i++){h+='<div class="pag-thumb"><img src="'+tempPaginas[i]+'"><button onclick="tempPaginas.splice('+i+',1);renderSeccion()" style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid #333;color:#fff;cursor:pointer">✕</button><span style="position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px">'+String(i+1).padStart(3,'0')+'</span></div>';}h+='<div class="marco-pagina" onclick="document.getElementById(\'filePaginas\').click()"><span style="font-size:32px;color:rgba(255,255,255,0.3)">+</span><p style="color:rgba(255,255,255,0.25);font-size:9px;letter-spacing:1px;margin-top:6px">agregar página</p></div></div>';z.innerHTML=h;}
}
function onPortadaCargada(){var f=this.files[0];if(!f) return;var r=new FileReader();r.onload=e=>{tempPortada=e.target.result; if(!tempFlaca) tempFlaca=e.target.result; renderSeccion()};r.readAsDataURL(f)}
function onFlacaCargada(){var f=this.files[0];if(!f) return;var r=new FileReader();r.onload=e=>{tempFlaca=e.target.result;renderSeccion()};r.readAsDataURL(f)}
function onPaginasCargadas(){var files=this.files;for(var k=0;k<files.length;k++){let r=new FileReader();r.onload=e=>{tempPaginas.push(e.target.result);renderSeccion()};r.readAsDataURL(files[k])}}
async function guardarComicFinal(){
 if(!tempPortada){cambiarSeccion("portada");modal('<h3>FALTA PORTADA</h3><button class="btn btn-w" style="margin-top:14px" onclick="cerrar()">OK</button>');return;}
 modal('<h3>CREANDO VERSION FLUIDA...</h3><p>Para que todos lo vean sin lag</p>');

   tempFlaca = await new Promise(r=>{
     let img=new Image();
     img.onload=()=>{
       let c=document.createElement("canvas");
       c.width=160; c.height=img.height*(160/img.width);
       c.getContext("2d").drawImage(img,0,0,c.width,c.height);
       r(c.toDataURL("image/jpeg",0.75));
     }; img.src=tempPortada;
   });
 }
 let obj={titulo:tempTitulo||"SIN TITULO",portada:tempPortada,flaca:tempFlaca,paginas:tempPaginas.length?tempPaginas:[tempPortada]};

 await cargarComics();
 videoFondoSrc = await cargarConfig("videoFondo");
 miFoto = await cargarConfig("fotoPerfil") || localStorage.getItem("mi_foto_perfil") || "img/perfil.jpg";
 document.getElementById("visorComics")?.remove();document.getElementById("editorComics")?.remove();
 var v=document.createElement("div");v.id="visorComics";
 var videoTag = videoFondoSrc? '<video id="videoFondo" autoplay loop muted playsinline src="'+videoFondoSrc+'"></video>' : '';
 var comicsHtml="";for(var i=0;i<comicsLista.length;i++){comicsHtml+='<div class="comicBox" data-id="'+comicsLista[i].id+'" style="position:relative"><div class="comic-flaco"><img class="portada-flaca" loading="lazy" decoding="async" src="'+comicsLista[i].flaca+'"><img class="portada-ancha" loading="lazy" decoding="async" src="'+comicsLista[i].portada+'"></div><div style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border-radius:8px;padding:4px 8px;z-index:3"><p style="color:#fff;font-size:9px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+comicsLista[i].titulo+'</p></div></div>';}
 var masHtml=esAdmin?'<div class="marco-mas" id="masComic"><span style="color:#fff;font-size:48px;font-weight:800">+</span></div>':'';
 var conectarBtn=esAdmin?'<button id="btnConectar" style="padding:8px 16px;border-radius:20px;background:'+(carpetaHandle?'#00ff88':'#fff')+';color:#000;font-weight:800;font-size:10px;letter-spacing:2px;cursor:pointer;margin-right:10px;border:none">📁 '+(carpetaHandle?'PC CONECTADA':'CONECTAR MI PC')+'</button>':'';
 var vacio='<div style="text-align:center;margin-top:80px"><p style="color:#333;letter-spacing:4px;font-size:12px">BIBLIOTECA VACÍA - '+comicsLista.length+'</p></div>';
 v.innerHTML=videoTag+'<div id="overlayGris"></div><div id="contenidoGaleria"><div style="height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a"><div style="display:flex;align-items:center;gap:12px"><b style="color:#fff;letter-spacing:4px;font-size:13px">BIBLIOTECA</b><span style="color:#444;font-size:10px">'+comicsLista.length+' CÓMICS</span></div><div style="display:flex;gap:10px;align-items:center">'+conectarBtn+'<div id="perfilBtn" style="width:42px;height:42px;border-radius:50%;border:1.5px solid #2a2a2a;overflow:hidden;cursor:pointer;background:#111"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div><button onclick="document.getElementById(\'visorComics\').remove()" style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid #222;color:#fff">✕</button></div></div><div id="grid" style="display:flex;gap:14px;padding:20px;overflow:auto;flex:1;align-items:center">'+(comicsLista.length?comicsHtml+masHtml:(esAdmin?masHtml:vacio))+'</div></div>';
 document.body.appendChild(v);
 if(document.getElementById("btnConectar")) document.getElementById("btnConectar").onclick=conectarCarpeta;
 document.getElementById("perfilBtn").onclick=clickPerfilComics;
 if(document.getElementById("masComic")) document.getElementById("masComic").onclick=()=>abrirEditorNuevo();
 document.querySelectorAll(".comicBox").forEach(box=>{let id=parseInt(box.getAttribute("data-id"));let flaco=box.querySelector(".comic-flaco");flaco.onclick=()=>verComic(id);flaco.oncontextmenu=e=>{e.preventDefault();if(!esAdmin) return;ctxId=id;let m=document.getElementById("menuCtx");m.style.left=e.clientX+"px";m.style.top=e.clientY+"px";m.style.display="flex";}});
 // FLUIDO PARA TODOS - PRECARGA EN SEGUNDO PLANO
 if('requestIdleCallback' in window){

       try{
         if(c.flaca) await createImageBitmap(await (await fetch(c.flaca)).blob());
         if(c.portada) await createImageBitmap(await (await fetch(c.portada)).blob());
       }catch(e){}
     });
   });
 }

 try{carpetaHandle=await window.showDirectoryPicker();modal('<h3>CONECTADA: '+carpetaHandle.name+'</h3><p>En orden: portada + pagina_001...</p><button class="btn btn-w" style="margin-top:14px" onclick="cerrar()">OK</button>');document.getElementById("btnConectar").textContent="📁 PC CONECTADA";document.getElementById("btnConectar").style.background="#00ff88";}catch(e){}

 if(!esAdmin){
  modal('<h3>ADMIN LOGIN</h3><input id="pass" type="password" style="width:100%;padding:14px;background:#000;color:#fff;border:1px solid #222;border-radius:12px;margin-top:14px;text-align:center"><button class="btn btn-w" style="margin-top:14px" onclick="if(document.getElementById(\'pass\').value===\''+CLAVE+'\'){esAdmin=true;localStorage.setItem(\'admin_sesion\',\'1\');cerrar();abrirComics()}">ENTRAR</button>');
 }else{
  modal('<h3>MI PERFIL</h3><div style="width:90px;height:90px;border-radius:50%;overflow:hidden;margin:14px auto;border:2px solid #333"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div><p>'+comicsLista.length+' cómics</p><button class="btn btn-w" style="margin-top:16px" onclick="cerrar();abrirEditorPerfil()">📷 CAMBIAR FOTO</button><button class="btn btn-b" style="margin-top:8px" onclick="cerrar();document.getElementById(\'inputVideoFondo\').click()">🎥 VIDEO FONDO</button><button class="btn btn-b" style="margin-top:8px" onclick="cerrar();abrirEditorNuevo()">+ AÑADIR CÓMIC</button><button class="btn btn-b" style="margin-top:8px;color:#ff5555" onclick="esAdmin=false;localStorage.removeItem(\'admin_sesion\');cerrar();abrirComics()">SALIR</button>');

let cropData={x:0,y:0,scale:1,img:null,startX:0,startY:0,drag:false};
function abrirEditorPerfil(){
 let ed=document.createElement("div");ed.id="editorPerfil";
 ed.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:18px"><p style="color:#fff;letter-spacing:4px;font-size:11px">MUEVE Y AJUSTA - SCROLL PARA ZOOM</p><div class="crop-wrap" id="cropWrap"><img id="cropImg" src="'+miFoto+'"><div class="crop-circle"></div></div><input id="zoomRange" type="range" min="0.05" max="3" step="0.001" value="1" style="width:300px;accent-color:#fff"><div style="display:flex;gap:10px"><button class="btn btn-b" onclick="document.getElementById(\'editorPerfil\').remove()">CANCELAR</button><button class="btn btn-w" style="width:140px" onclick="guardarFotoPerfil()">GUARDAR</button></div><input type="file" id="inputNuevaFoto" accept="image/*" style="display:none"><button class="btn btn-b" style="margin-top:6px;font-size:10px" onclick="document.getElementById(\'inputNuevaFoto\').click()">ELEGIR OTRA FOTO</button></div>';
 document.body.appendChild(ed);
 let img=document.getElementById("cropImg");
 let wrap=document.getElementById("cropWrap");
 cropData={x:0,y:0,scale:0.5,img:img,startX:0,startY:0,drag:false};
 img.onload=()=>{let ratioW=wrap.clientWidth/img.naturalWidth;let ratioH=wrap.clientHeight/img.naturalHeight;let fitScale=Math.min(ratioW,ratioH);fitScale=Math.min(fitScale,1);cropData.scale=fitScale;cropData.x=(wrap.clientWidth-img.naturalWidth*fitScale)/2;cropData.y=(wrap.clientHeight-img.naturalHeight*fitScale)/2;aplicarCrop();document.getElementById("zoomRange").value=fitScale;document.getElementById("zoomRange").min=fitScale*0.3;};
 if(img.complete) img.onload();
 wrap.onpointerdown=e=>{cropData.drag=true;cropData.startX=e.clientX-cropData.x;cropData.startY=e.clientY-cropData.y;wrap.setPointerCapture(e.pointerId)};
 wrap.onpointermove=e=>{if(!cropData.drag) return;cropData.x=e.clientX-cropData.startX;cropData.y=e.clientY-cropData.startY;aplicarCrop()};
 wrap.onpointerup=e=>{cropData.drag=false;};
 wrap.onwheel=e=>{e.preventDefault();let slider=document.getElementById("zoomRange");let s=parseFloat(slider.value);s+=e.deltaY<0?0.02:-0.02;s=Math.max(parseFloat(slider.min),Math.min(3,s));slider.value=s;zoomCrop(s);};
 document.getElementById("zoomRange").oninput=function(){zoomCrop(parseFloat(this.value))};
 document.getElementById("inputNuevaFoto").onchange=function(){let f=this.files[0];if(!f) return;let r=new FileReader();r.onload=e=>{img.src=e.target.result};r.readAsDataURL(f)};
}
function aplicarCrop(){cropData.img.style.transform='translate('+cropData.x+'px,'+cropData.y+'px) scale('+cropData.scale+')';cropData.img.style.transformOrigin='0 0';}
function zoomCrop(s){let wrap=document.getElementById("cropWrap");let cx=wrap.clientWidth/2, cy=wrap.clientHeight/2;let ratio=s/cropData.scale;cropData.x=cx-(cx-cropData.x)*ratio;cropData.y=cy-(cy-cropData.y)*ratio;cropData.scale=s;aplicarCrop();}
async function guardarFotoPerfil(){let canvas=document.createElement("canvas");canvas.width=320;canvas.height=320;let ctx=canvas.getContext("2d");let img=cropData.img;ctx.save();ctx.beginPath();ctx.arc(160,160,160,0,Math.PI*2);ctx.clip();ctx.drawImage(img, cropData.x, cropData.y, img.naturalWidth*cropData.scale, img.naturalHeight*cropData.scale);ctx.restore();let data=canvas.toDataURL("image/jpeg",0.9);await guardarConfig("fotoPerfil",data);localStorage.setItem("mi_foto_perfil",data);miFoto=data;document.getElementById("editorPerfil").remove();abrirComics();}
function verComic(id){let c=comicsLista.find(x=>x.id===id);let pagina=0;let d=document.createElement("div");d.id="visorFoto";d.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);z-index:99999999;display:flex;align-items:center;justify-content:center";d.innerHTML='<button class="flecha" style="left:20px" id="prevB">‹</button><img id="imgG2" src="'+c.paginas[0]+'" style="max-width:82%;max-height:78%;border-radius:16px;border:1px solid #222;transition:all 0.35s ease"><button class="flecha" style="right:20px" id="nextB">›</button><button class="btnX" onclick="this.parentElement.remove()">CERRAR ✕</button><div id="pInfo" style="position:absolute;top:18px;color:#555;font-size:11px;letter-spacing:3px">1 / '+c.paginas.length+'</div>';document.body.appendChild(d);function cambiar(dir){let img=document.getElementById("imgG2");img.style.transition="all 0.35s ease";img.style.filter="blur(18px)";img.style.opacity="0";img.style.transform="scale(0.94)";setTimeout(()=>{pagina+=dir;if(pagina<0) pagina=c.paginas.length-1;if(pagina>=c.paginas.length) pagina=0;img.src=c.paginas[pagina];document.getElementById("pInfo").textContent=(pagina+1)+" / "+c.paginas.length;img.style.filter="blur(0px)";img.style.opacity="1";img.style.transform="scale(1)";},220);}document.getElementById("prevB").onclick=()=>cambiar(-1);document.getElementById("nextB").onclick=()=>cambiar(1);}
var cont=document.getElementById('botonera');
listaBotones.forEach(function(b){var wrap=document.createElement('div');wrap.className='boton-wrap';var mini=document.createElement('div');mini.className='mini-left';mini.innerHTML='<img src="'+(b.miniImg||b.img)+'">';var btn=document.createElement('div');btn.className='btn-img';btn.innerHTML='<img src="'+b.img+'">';if(b.tipo==='COMICS') btn.onclick=abrirComics;wrap.appendChild(mini);wrap.appendChild(btn);cont.appendChild(wrap);});
document.addEventListener("click",()=>{document.getElementById("menuCtx").style.display="none";});
document.getElementById("ctxEditar").onclick=()=>{document.getElementById("menuCtx").style.display="none";abrirEditorNuevo(ctxId);};
document.getElementById("ctxEliminar").onclick=async()=>{document.getElementById("menuCtx").style.display="none";await borrarEnDB(ctxId);abrirComics();};
abrirDB().then(async()=>{await cargarComics();let v=await cargarConfig("videoFondo");if(v) videoFondoSrc=v;});
let inpV=document.createElement("input");inpV.type="file";inpV.id="inputVideoFondo";inpV.accept="video/*";inpV.style.display="none";
inpV.onchange=function(){let f=this.files[0];if(!f) return;let r=new FileReader();r.onload=async e=>{await guardarConfig("videoFondo",e.target.result);modal('<h3>VIDEO GUARDADO</h3><p>Se verá para todos</p><button class="btn btn-w" style="margin-top:12px" onclick="cerrar();abrirComics()">OK</button>')};r.readAsDataURL(f);};
document.body.appendChild(inpV);
</script>

<script>
(function(){
  // === AQUI ANADES TUS MUSICAS, MAX 5 ===
  const SONGS = [
    "BOSSA.mp3",
    "LANDSCAPE.mp3",
    "EmbersCALL.mp3"
  ];

  // === IMAGENES DE BOTONES, PUEDES CAMBIARLAS ===
  const IMG_SOUND_ON = "https://cdn-icons-png.flaticon.com/512/138/138817.png";
  const IMG_SOUND_OFF = "https://cdn-icons-png.flaticon.com/512/64/64595.png";
  const IMG_NEXT = "https://cdn-icons-png.flaticon.com/512/138/138932.png";

  const player = document.getElementById("player");
  const btnMute = document.getElementById("btn-mute");
  const btnNext = document.getElementById("btn-next");

  let idx = 0;
  let clicks = 0;
  const MAX_CLICKS = 5; // maximo de cambios

  player.src = SONGS[0];
  player.volume = 0.6;
  player.loop = true; // loop infinito cada cancion

  // autoplay al primer click en la pagina
  document.addEventListener("click", function init(){
    player.play().catch(()=>{});
    document.removeEventListener("click", init);
  });

  btnMute.src = IMG_SOUND_ON;
  btnNext.src = IMG_NEXT;

  btnMute.addEventListener("click", function(){
    player.muted =!player.muted;
    btnMute.src = player.muted? IMG_SOUND_OFF : IMG_SOUND_ON;
  });

  btnNext.addEventListener("click", function(){
    if(clicks >= MAX_CLICKS) return;
    clicks++;
    idx = (idx + 1) % SONGS.length;
    player.src = SONGS[idx];
    player.play().catch(()=>{});
    if(clicks >= MAX_CLICKS){
      btnNext.style.opacity = "0.3";
      btnNext.style.pointerEvents = "none";
    }
  });

  // si quieres que cambie sola al terminar, quita player.loop = true y usa esto:
  // player.addEventListener("ended", ()=>{ btnNext.click(); });

})();
</script>

<script>
(function(){
  const PASS_F = "admin123";
  const MAX_IMG = 6;
  let imagenes = JSON.parse(localStorage.getItem("feed_imgs") || '["https://picsum.photos/300/300?1","https://picsum.photos/300/300?2","https://picsum.photos/300/300?3","https://picsum.photos/300/300?4"]');
  const cont = document.getElementById("feed-wrap");

  function render(){
    cont.innerHTML = "";
    imagenes.forEach((src)=>{
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `<img src="${src}" loading="lazy">`;
      cont.appendChild(div);
    });
  }
  render();
  cont.addEventListener("dblclick", openAdmin);
  function openAdmin(){
    if(prompt("Pass:") !== PASS_F) return;
    let op = prompt("1=agregar 2=borrar ultima 3=borrar todas | Total:"+imagenes.length+"/"+MAX_IMG);
    if(op==="1"){
      if(imagenes.length>=MAX_IMG){ alert("Max "+MAX_IMG); return; }
      let url = prompt("URL o archivo:");
      if(!url) return;
      imagenes.push(url.trim());
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="2"){
      imagenes.pop();
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="3"){
      imagenes=[];
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
  }
})();
</script>

<script>
const MAC_PASS="admin123";const LINK_KEY="xbox_links_v1";let links=JSON.parse(localStorage.getItem(LINK_KEY)||'{"tiktok":"","discord":"","youtube":"","insta":""}');let macEditable=false;
function abrirMac(){document.getElementById("mac-wrap").style.display="block"}function cerrarMac(){document.getElementById("mac-wrap").style.display="none"}
function openLink(t){if(macEditable)return;let u=links[t];if(!u)return alert("Sin link");window.open(u,"_blank")}
function toggleEdit(){let p=document.getElementById("mac-edit-panel"),b=document.getElementById("mac-edit-btn");if(!macEditable){if(prompt("Pass:")!==MAC_PASS)return;macEditable=true;p.style.display="block";document.getElementById("inp-tiktok").value=links.tiktok;document.getElementById("inp-discord").value=links.discord;document.getElementById("inp-youtube").value=links.youtube;document.getElementById("inp-insta").value=links.insta;b.textContent="GUARDAR"}else{links.tiktok=document.getElementById("inp-tiktok").value.trim();links.discord=document.getElementById("inp-discord").value.trim();links.youtube=document.getElementById("inp-youtube").value.trim();links.insta=document.getElementById("inp-insta").value.trim();localStorage.setItem(LINK_KEY,JSON.stringify(links));macEditable=false;p.style.display="none";b.textContent="EDITAR";alert("Guardado")}}
window.addEventListener('load',()=>{setTimeout(()=>{document.getElementById('splash').classList.add('oculto');setTimeout(()=>document.getElementById('splash').remove(),800)},1200)})
let db,comicsLista=[],galeriaLista=[],origenActual="comics";
function abrirDB(){return new Promise(r=>{let q=indexedDB.open("comicsDB_v3",3);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("comics"))d.createObjectStore("comics",{keyPath:"id",autoIncrement:true});if(!d.objectStoreNames.contains("config"))d.createObjectStore("config",{keyPath:"k"});if(!d.objectStoreNames.contains("galeria"))d.createObjectStore("galeria",{keyPath:"id",autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r()}})}
async function cargarComics(){if(!db)await abrirDB();return new Promise(r=>{let t=db.transaction("comics","readonly").objectStore("comics").getAll();t.onsuccess=()=>{comicsLista=t.result;r()}})}
async function cargarGaleria(){if(!db)await abrirDB();return new Promise(r=>{let t=db.transaction("galeria","readonly").objectStore("galeria").getAll();t.onsuccess=()=>{galeriaLista=t.result;r()}})}
async function guardarEnDB(o){return new Promise(r=>{let t=db.transaction("comics","readwrite").objectStore("comics").put(o);t.onsuccess=()=>r(t.result)})}
async function guardarGaleriaDB(o){return new Promise(r=>{let t=db.transaction("galeria","readwrite").objectStore("galeria").put(o);t.onsuccess=()=>r(t.result)})}
async function borrarEnDB(id){return new Promise(r=>{let t=db.transaction("comics","readwrite").objectStore("comics").delete(id);t.onsuccess=()=>r()})}
async function borrarGaleriaDB(id){return new Promise(r=>{let t=db.transaction("galeria","readwrite").objectStore("galeria").delete(id);t.onsuccess=()=>r()})}
async function guardarConfig(k,v){return new Promise(r=>{let t=db.transaction("config","readwrite").objectStore("config").put({k,v});t.onsuccess=()=>r()})}
async function cargarConfig(k){return new Promise(r=>{let t=db.transaction("config","readonly").objectStore("config").get(k);t.onsuccess=()=>r(t.result?.v||null)})}
var miFoto=localStorage.getItem("mi_foto_perfil")||"img/perfil.jpg",esAdmin=localStorage.getItem("admin_sesion")==="1";
var videoFondoSrc=null,tempTitulo="",tempPortada="",tempFlaca="",tempPaginas=[],editId=null,seccionActiva="titulo",ctxId=null,ctxGaleriaId=null;

function modal(h){document.getElementById("modalBox").innerHTML='<div class="modalCard">'+h+'</div>';document.getElementById("modalBox").style.display="flex"}
function cerrar(){document.getElementById("modalBox").style.display="none"}
async function abrirEditorNuevo(id){ if(id!==undefined){let c=comicsLista.find(x=>x.id===id);tempTitulo=c.titulo;tempPortada=c.portada;tempFlaca=c.flaca||c.portada;tempPaginas=[...c.paginas];editId=id;} else {tempTitulo="";tempPortada="";tempFlaca="";tempPaginas=[];editId=null;} seccionActiva="titulo";document.getElementById("visorComics")?.remove();document.getElementById("visorGaleria")?.remove();document.getElementById("editorComics")?.remove(); var ed=document.createElement("div");ed.id="editorComics"; ed.innerHTML='<div id="overlayGris"></div><div class="menu-der"><button id="btnTitulo" class="activo" onclick="cambiarSeccion(\'titulo\')">TITULO</button><button id="btnPortada" onclick="cambiarSeccion(\'portada\')">PORTADA</button><button id="btnPaginas" onclick="cambiarSeccion(\'paginas\')">PAGINAS</button><div style="height:1px;background:rgba(255,255,255,0.1);margin:8px 0"></div><button style="background:#fff;color:#000;padding:12px 22px;border-radius:30px;font-weight:700;letter-spacing:2px;border:none;cursor:pointer" onclick="guardarComicFinal()">GUARDAR</button><button onclick="document.getElementById(\'editorComics\').remove();abrirComics()" style="padding:12px 22px;border-radius:30px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);letter-spacing:3px;font-size:11px;cursor:pointer">SALIR</button></div><div id="zonaCentro" style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:40px"></div><input type="file" id="filePortada" accept="image/*" style="display:none"><input type="file" id="fileFlaca" accept="image/*" style="display:none"><input type="file" id="filePaginas" accept="image/*" multiple style="display:none">'; document.body.appendChild(ed);document.getElementById("filePortada").onchange=onPortadaCargada;document.getElementById("fileFlaca").onchange=onFlacaCargada;document.getElementById("filePaginas").onchange=onPaginasCargadas;renderSeccion();}
function cambiarSeccion(s){seccionActiva=s;document.querySelectorAll(".menu-der button").forEach(b=>b.classList.remove("activo"));document.getElementById("btn"+s.charAt(0).toUpperCase()+s.slice(1)).classList.add("activo");renderSeccion()}
function renderSeccion(){ var z=document.getElementById("zonaCentro"); if(seccionActiva==="titulo"){z.innerHTML='<div style="width:100%;max-width:500px"><p style="color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:4px;margin-bottom:12px">TITULO DEL CÓMIC</p><input id="inputTitulo" value="'+tempTitulo+'" placeholder="ESCRIBE EL TITULO" style="width:100%;padding:18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:14px;color:#fff;outline:none;font-size:18px" oninput="tempTitulo=this.value"></div>';} else if(seccionActiva==="portada"){ let a=tempPortada?'<div class="marco-steam-portada" onclick="document.getElementById(\'filePortada\').click()"><img src="'+tempPortada+'"></div>':'<div class="marco-steam-portada" onclick="document.getElementById(\'filePortada\').click()"><span style="font-size:64px;color:rgba(255,255,255,0.3)">+</span></div>'; let f=tempFlaca?'<div class="marco-steam-flaca" onclick="document.getElementById(\'fileFlaca\').click()"><img src="'+tempFlaca+'"></div>':'<div class="marco-steam-flaca" onclick="document.getElementById(\'fileFlaca\').click()"><span style="font-size:32px;color:rgba(255,255,255,0.3)">+</span></div>'; z.innerHTML='<div style="display:flex;gap:24px;align-items:flex-end">'+f+a+'</div>'; }else{var h='<div class="galeria-paginas">';for(var i=0;i<tempPaginas.length;i++){h+='<div class="pag-thumb"><img src="'+tempPaginas[i]+'"><button onclick="tempPaginas.splice('+i+',1);renderSeccion()" style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid #333;color:#fff">✕</button></div>';}h+='<div class="marco-pagina" onclick="document.getElementById(\'filePaginas\').click()"><span style="font-size:32px;color:rgba(255,255,255,0.3)">+</span></div></div>';z.innerHTML=h;}}
function onPortadaCargada(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=e=>{tempPortada=e.target.result;if(!tempFlaca)tempFlaca=e.target.result;renderSeccion()};r.readAsDataURL(f)}
function onFlacaCargada(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=e=>{tempFlaca=e.target.result;renderSeccion()};r.readAsDataURL(f)}
function onPaginasCargadas(){var files=this.files;for(var k=0;k<files.length;k++){let r=new FileReader();r.onload=e=>{tempPaginas.push(e.target.result);renderSeccion()};r.readAsDataURL(files[k])}}
async function guardarComicFinal(){if(!tempPortada){cambiarSeccion("portada");modal('<h3>FALTA PORTADA</h3><button class="btn btn-w" style="margin-top:14px" onclick="cerrar()">OK</button>');return;}let obj={titulo:tempTitulo||"SIN TITULO",portada:tempPortada,flaca:tempFlaca||tempPortada,paginas:tempPaginas.length?tempPaginas:[tempPortada]};if(editId)obj.id=editId;await guardarEnDB(obj);cerrar();document.getElementById("editorComics")?.remove();abrirComics();}
async function cargarComicsPublicos(){ try{ let r = await fetch('./comics.json?v='+Date.now()); if(r.ok){ let data = await r.json(); if(Array.isArray(data) && data.length>0){ comicsLista = data; return true; } } }catch(e){} return false; }
async function abrirComics(){ origenActual="comics"; let publicos = await cargarComicsPublicos(); if(!publicos) await cargarComics(); videoFondoSrc = await cargarConfig("videoFondo"); miFoto = await cargarConfig("fotoPerfil") || localStorage.getItem("mi_foto_perfil") || "img/perfil.jpg"; document.getElementById("visorComics")?.remove();document.getElementById("visorGaleria")?.remove();document.getElementById("editorComics")?.remove(); var v=document.createElement("div");v.id="visorComics"; var videoTag = videoFondoSrc? '<video id="videoFondo" autoplay loop muted playsinline src="'+videoFondoSrc+'"></video>' : ''; var comicsHtml="";for(var i=0;i<comicsLista.length;i++){comicsHtml+='<div class="comicBox" data-id="'+(comicsLista[i].id||i)+'" style="position:relative"><div class="comic-flaco"><img class="portada-flaca" src="'+comicsLista[i].flaca+'" draggable="false"><img class="portada-ancha" src="'+comicsLista[i].portada+'" draggable="false"></div><div style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border-radius:8px;padding:4px 8px;z-index:6"><p style="color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+comicsLista[i].titulo+'</p></div></div>';} var vacio='<div style="text-align:center;margin-top:80px"><p style="color:#333;letter-spacing:4px;font-size:12px">BIBLIOTECA VACÍA - '+comicsLista.length+'</p></div>'; v.innerHTML=videoTag+'<div id="overlayGris"></div><div id="contenidoGaleria"><div style="height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a"><div style="display:flex;align-items:center;gap:12px"><b style="color:#fff;letter-spacing:4px;font-size:13px">BIBLIOTECA</b><span style="color:#444;font-size:10px">'+comicsLista.length+' CÓMICS</span></div><div style="display:flex;gap:10px;align-items:center"><div id="perfilBtn" style="width:42px;height:42px;border-radius:50%;border:1.5px solid #2a2a2a;overflow:hidden;cursor:pointer;background:#111"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div><button onclick="document.getElementById(\'visorComics\').remove()" style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid #222;color:#fff">✕</button></div></div><div id="grid" style="display:flex;gap:18px;padding:20px 40px;overflow:auto;flex:1;align-items:center">'+(comicsLista.length?comicsHtml:vacio)+'</div></div>'; document.body.appendChild(v); document.getElementById("perfilBtn").onclick=clickPerfilComics; document.querySelectorAll(".comicBox").forEach((box,idx)=>{let flaco=box.querySelector(".comic-flaco");flaco.onclick=()=>verComicPorIndice(idx);flaco.oncontextmenu=e=>{e.preventDefault();if(!esAdmin)return;ctxId=comicsLista[idx].id;let m=document.getElementById("menuCtx");m.style.left=e.clientX+"px";m.style.top=e.clientY+"px";m.style.display="flex";}});}
function clickPerfilComics(){ if(!esAdmin){modal('<h3>ACCESO DENEGADO</h3><p>Solo Lxvtorres</p><input id="loginAdmin" type="password" placeholder="Pass" style="width:100%;margin-top:12px;padding:10px;background:#000;border:1px solid #222;border-radius:8px;color:#fff"><button class="btn btn-w" style="margin-top:10px" onclick="if(document.getElementById(\'loginAdmin\').value===\'admin123\'){localStorage.setItem(\'admin_sesion\',\'1\');esAdmin=true;cerrar();abrirComics();}else{alert(\'Incorrecto\')}">ENTRAR</button>');return;} modal('<h3>MI PERFIL - LXVTORRES</h3><p>'+comicsLista.length+' cómics (local)</p><button class="btn btn-w" style="margin-top:12px" onclick="cerrar();abrirEditorNuevo()">+ AÑADIR CÓMIC</button><button class="btn btn-b" style="margin-top:8px" onclick="exportarComics()">⬇ JSON (comprimido)</button><button class="btn btn-b" style="margin-top:8px" onclick="cerrar();abrirEditorPerfil(\'comics\')">📷 CAMBIAR FOTO</button><button class="btn btn-b" style="margin-top:8px;color:#ff5555" onclick="esAdmin=false;localStorage.removeItem(\'admin_sesion\');cerrar();document.getElementById(\'visorComics\').remove()">SALIR</button>');}
async function exportarComics(){ function comprimirImagen(src, maxW, calidad){ return new Promise(res=>{ let img=new Image(); img.onload=()=>{ let ratio=img.width/img.height; let w=maxW, h=maxW/ratio; if(img.width<maxW){ w=img.width; h=img.height; } let c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg', calidad)); }; img.onerror=()=>res(src); img.src=src; }); } let listaComprimida=[]; for(let c of comicsLista){ let portadaC = await comprimirImagen(c.portada, 600, 0.5); let flacaC = await comprimirImagen(c.flaca||c.portada, 300, 0.5); let paginasC=[]; for(let p of c.paginas){ paginasC.push(await comprimirImagen(p, 800, 0.5)); } listaComprimida.push({id:c.id, titulo:c.titulo, portada:portadaC, flaca:flacaC, paginas:paginasC}); } let data = JSON.stringify(listaComprimida); let blob = new Blob([data], {type:'application/json'}); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href=url; a.download='comics.json'; a.click(); alert('¡Listo COMPRIMIDO!');}
function verComicPorIndice(idx){let c=comicsLista[idx];let pagina=0;let d=document.createElement("div");d.id="visorFoto";d.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);z-index:99999999;display:flex;align-items:center;justify-content:center";d.innerHTML='<button class="flecha" style="left:20px" id="prevB">‹</button><img id="imgG2" src="'+c.paginas[0]+'" draggable="false" style="width:90vw;height:90vh;max-width:90vw;max-height:90vh;object-fit:contain;border-radius:16px;border:1px solid #222;transition:all 0.35s ease"><button class="flecha" style="right:20px" id="nextB">›</button><button class="btnX" onclick="this.parentElement.remove()" style="top:20px;right:22px;left:auto;bottom:auto;transform:none;padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,0.5)">X</button><div id="btnLupa">⤢</div><div id="pInfo" style="position:absolute;top:18px;color:#555;font-size:11px;letter-spacing:3px">1 / '+c.paginas.length+'</div>';document.body.appendChild(d);function cambiar(dir){let img=document.getElementById("imgG2");img.style.filter="blur(18px)";img.style.opacity="0";setTimeout(()=>{pagina+=dir;if(pagina<0)pagina=c.paginas.length-1;if(pagina>=c.paginas.length)pagina=0;img.src=c.paginas[pagina];document.getElementById("pInfo").textContent=(pagina+1)+" / "+c.paginas.length;img.style.filter="blur(0px)";img.style.opacity="1";},220);}document.getElementById("prevB").onclick=()=>cambiar(-1);document.getElementById("nextB").onclick=()=>cambiar(1);document.getElementById("btnLupa").onclick=()=>{d.classList.toggle("modo-lupa")};}

async function abrirGaleria(){ origenActual="galeria"; await cargarGaleria(); videoFondoSrc = await cargarConfig("videoFondo"); miFoto = await cargarConfig("fotoPerfil") || localStorage.getItem("mi_foto_perfil") || "img/perfil.jpg"; document.getElementById("visorComics")?.remove();document.getElementById("visorGaleria")?.remove();document.getElementById("editorComics")?.remove(); var v=document.createElement("div");v.id="visorGaleria"; var videoTag = videoFondoSrc? '<video id="videoFondo" autoplay loop muted playsinline src="'+videoFondoSrc+'"></video>' : ''; var pinsHtml="";for(var i=0;i<galeriaLista.length;i++){pinsHtml+='<div class="pin" data-id="'+galeriaLista[i].id+'"><img src="'+galeriaLista[i].imagen+'" draggable="false"><div class="pin-title">'+galeriaLista[i].titulo+'</div></div>';} var masHtml=esAdmin?'<div class="marco-pin-mas" id="masGaleria"><span style="color:#fff;font-size:48px">+</span></div>':''; var vacio='<div style="text-align:center;margin-top:80px;column-span:all"><p style="color:#333;letter-spacing:4px">GALERÍA VACÍA</p></div>'; v.innerHTML=videoTag+'<div id="overlayGris"></div><div id="contenidoGaleria"><div style="height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a"><div style="display:flex;align-items:center;gap:12px"><b style="color:#fff;letter-spacing:4px">GALERÍA</b><span style="color:#444;font-size:10px">'+galeriaLista.length+' FOTOS</span></div><div style="display:flex;gap:10px;align-items:center"><div id="perfilBtnG" style="width:42px;height:42px;border-radius:50%;border:1.5px solid #2a2a2a;overflow:hidden;cursor:pointer;background:#111"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div><button onclick="document.getElementById(\'visorGaleria\').remove()" style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid #222;color:#fff">✕</button></div></div><div id="pinterestGrid">'+(galeriaLista.length?pinsHtml+masHtml:(esAdmin?masHtml:vacio))+'</div></div>'; document.body.appendChild(v); document.getElementById("perfilBtnG").onclick=clickPerfilGaleria; if(document.getElementById("masGaleria")) document.getElementById("masGaleria").onclick=()=>abrirEditorGaleria();}
function verFotoGaleria(id){let g=galeriaLista.find(x=>x.id===id);let d=document.createElement("div");d.id="visorFotoMini";d.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99999999;display:flex;align-items:center;justify-content:center";d.innerHTML='<img src="'+g.imagen+'" style="max-width:88%;max-height:85%;border-radius:18px"><button class="btnX" onclick="this.parentElement.remove()">CERRAR ✕</button>';document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.remove()}}

const black=document.getElementById('blackScreen');
function ponerNegro(){black.style.display='flex';document.querySelectorAll('img,canvas,video').forEach(e=>{if(e.id!=='celina-video'&&e.id!=='renya-img')e.style.opacity='0';});setTimeout(()=>{black.style.display='none';document.querySelectorAll('img,canvas,video').forEach(e=>e.style.opacity='1');},2500);}
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'||e.keyCode===44){ponerNegro();navigator.clipboard.writeText('');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden) ponerNegro();});
window.addEventListener('blur', ponerNegro);
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG') e.preventDefault();});

.mac-btn{background:#222;color:#aaa;border:1px solid #333;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Cinzel',serif;letter-spacing:2px;transition:.2s}

<script>
const MAC_PASS="admin123";
const LINK_KEY="xbox_links_v1";
let links = JSON.parse(localStorage.getItem(LINK_KEY) || '{"tiktok":"","discord":"","youtube":"","insta":""}');
let macEditable=false;
function abrirMac(){ document.getElementById("mac-wrap").style.display="block"; }
function cerrarMac(){ document.getElementById("mac-wrap").style.display="none"; }
function openLink(t){ if(macEditable) return; const u=links[t]; if(!u) return alert("Sin link para "+t); window.open(u,"_blank"); }
function toggleEdit(){
  const panel=document.getElementById("mac-edit-panel"), btn=document.getElementById("mac-edit-btn");
  if(!macEditable){
    if(prompt("Pass:")!==MAC_PASS) return;
    macEditable=true; panel.style.display="block";
    document.getElementById("inp-tiktok").value=links.tiktok;
    document.getElementById("inp-discord").value=links.discord;
    document.getElementById("inp-youtube").value=links.youtube;
    document.getElementById("inp-insta").value=links.insta;
    btn.textContent="GUARDAR"; btn.style.color="white"; btn.style.borderColor="white";
  }else{
    links.tiktok=document.getElementById("inp-tiktok").value.trim();
    links.discord=document.getElementById("inp-discord").value.trim();
    links.youtube=document.getElementById("inp-youtube").value.trim();
    links.insta=document.getElementById("inp-insta").value.trim();
    localStorage.setItem(LINK_KEY, JSON.stringify(links));
    macEditable=false; panel.style.display="none"; btn.textContent="EDITAR"; btn.style.color=""; btn.style.borderColor=""; alert("Guardado!");
  }
}
(function(){
  const bar=document.getElementById("mac-bar"), wrap=document.getElementById("mac-wrap");
  let down=false,sx,sy,il,it;
  bar.addEventListener("mousedown",e=>{down=true;const r=wrap.getBoundingClientRect();il=r.left;it=r.top;sx=e.clientX;sy=e.clientY;});
  window.addEventListener("mousemove",e=>{if(!down)return;wrap.style.left=(il+e.clientX-sx+wrap.offsetWidth/2)+"px";wrap.style.top=(it+e.clientY-sy+wrap.offsetHeight/2)+"px";});
  window.addEventListener("mouseup",()=>down=false);
})();
</script>

<script>
(function(){
  const PASS2 = "admin123";
  const VIDEO_QUIETA = "RENYA.mp4";
  const VIDEO_HABLANDO = "RENYATALKS.mp4";

  let lista = JSON.parse(localStorage.getItem("frases") || '["Hola!, mucho gusto estoy aqui para brindarte consejos basicos","Mira la galeria","Esta diseñada para los fanarts","tambien puedes apoyar el contenido al visitar las demas redes sociales, los links se encuentran abajo","este sitio se encuentra en una fase muy temprana asi que no hay mucho que hacer por ahora lo siento..."]');
  let pos=0, busy=false;

  const elIdle = document.getElementById("pj-video-idle");
  const elTalk = document.getElementById("pj-video-talk");
  const elGlobo = document.getElementById("pj-globo");

  elIdle.src = VIDEO_QUIETA;
  elTalk.src = VIDEO_HABLANDO;
  elIdle.load(); elTalk.load();
  elIdle.play().catch(()=>{});

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beepOriginal(){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='square';
    o.frequency.value = 185 + Math.random()*12;
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.13);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.13);
  }

  function ajustarFuente(t){
    let s=18; if(t.length>70)s=15; if(t.length>130)s=13; if(t.length>200)s=11.5;
    elGlobo.style.fontSize=s+"px";
  }

  function escribir(texto){
    if(busy) return;
    busy=true;
    if(audioCtx.state==='suspended') audioCtx.resume();
    elIdle.style.display="none"; elIdle.pause();
    elTalk.style.display="block"; elTalk.currentTime=0; elTalk.play().catch(()=>{});
    elGlobo.style.display="block"; elGlobo.textContent=""; ajustarFuente(texto);
    let i=0;
    let inter=setInterval(()=>{
      elGlobo.textContent+=texto[i]||"";
      if(texto[i] && texto[i]!=" " && i%2==0) beepOriginal();
      i++;
      if(i>=texto.length){
        clearInterval(inter);
        elTalk.pause(); elTalk.style.display="none";
        elIdle.style.display="block"; elIdle.play().catch(()=>{});
        setTimeout(()=>{ elGlobo.style.display="none"; busy=false; },2500);
      }
    },28);
  }

  function siguienteFrase(){
    if(busy ||!lista.length) return;
    escribir(lista[pos]);
    pos=(pos+1)%lista.length;
  }
  elIdle.addEventListener("click", siguienteFrase);
  elTalk.addEventListener("click", siguienteFrase);

  let t=null;
  function startHold(){ t=setTimeout(openAdmin,1200); }
  function stopHold(){ clearTimeout(t); }
  elIdle.addEventListener("mousedown",startHold);
  elIdle.addEventListener("mouseup",stopHold);
  elIdle.addEventListener("mouseleave",stopHold);
  elIdle.addEventListener("touchstart",startHold,{passive:true});
  elIdle.addEventListener("touchend",stopHold);

  function openAdmin(){
    if(prompt("Pass:")!==PASS2) return;
    let txt=prompt("Actuales:\n"+lista.join("\n")+"\n\nNuevo texto, vacio borra ultimo:");
    if(txt===null) return; txt=txt.trim();
    if(txt==="") lista.pop(); else lista.push(txt);
    localStorage.setItem("frases",JSON.stringify(lista));
  }
})();
</script>

<style>

<script>
var clave = "admin123";
var fondo = "videos/fondoGaleria.mp4";
var lista = JSON.parse(localStorage.getItem("fotos") || "[]");
var esAdmin = localStorage.getItem("admin_sesion") === "1";
var actual = 0;

var listaBotones = [
  { img:'COMICSBOTONPORT.png', miniImg:'img/m1.png', miniVideo:'OJOANIMATED.mp4', tipo:'COMICS' },
  { img:'img/b2.jpg', miniImg:'img/m2.png', miniVideo:'videos/m2.mp4', tipo:'GALERIA' },
  { img:'img/b3.jpg', miniImg:'img/m3.png', miniVideo:'videos/m3.mp4', link:'#' },
  { img:'img/b4.jpg', miniImg:'img/m4.png', miniVideo:'videos/m4.mp4', link:'#' },
  { img:'img/b5.jpg', miniImg:'img/m5.png', miniVideo:'videos/m5.mp4', link:'#' },
  { img:'img/b6.jpg', miniImg:'img/m6.png', miniVideo:'videos/m6.mp4', link:'#' }
];

function abrirComics(){
  var s = document.getElementById("sonidoComics"); if(s){ s.currentTime=0; s.play().catch(function(){}); }
  var v = document.getElementById("visorComics"); if(v) v.remove();
  var d = document.createElement("div"); d.id="visorComics";
  d.innerHTML = '<button id="closeX">X</button><iframe src="/sitio-web-series/public/comics/" style="width:100%;height:100%;border:none"></iframe>';
  document.body.appendChild(d);
  document.getElementById("closeX").onclick = function(){ d.remove(); };
}

function abrirGaleria(){
  var s = document.getElementById("sonidoComics"); if(s){ s.currentTime=0; s.play().catch(function(){}); }
  var v = document.getElementById("visorComics"); if(v) v.remove();
  var visor = document.createElement("div"); visor.id="visorComics";
  var htmlFotos = "";
  for(var i=0;i<lista.length;i++){
    htmlFotos += '<div><img src="'+lista[i]+'" ondblclick="borrarFoto('+i+')" onclick="verFoto('+i+')" style="width:100%;height:220px;object-fit:cover;border:2px solid #fff;border-radius:8px;cursor:pointer"></div>';
  }
  if(htmlFotos===""){ htmlFotos = '<p style="color:#fff;text-align:center;margin-top:40px">No hay fotos</p>'; }
  var vid = "";
  if(fondo!==""){ vid = '<video src="'+fondo+'" autoplay muted loop playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:0.35"></video>'; }
  var icono = esAdmin? "✓" : "◉";
  visor.innerHTML = vid + '<div style="height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;border-bottom:2px solid #fff;background:rgba(0,0,0,0.8)"><b style="color:#fff;letter-spacing:2px">GALERÍA</b><div style="display:flex;gap:10px;align-items:center"><div onclick="clickPerfil()" style="width:38px;height:38px;border-radius:50%;background:#222;border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold">'+icono+'</div><button onclick="document.getElementById(&apos;visorComics&apos;).remove()" style="width:38px;height:38px;border-radius:50%;background:#000;color:#fff;border:2px solid #fff;cursor:pointer">X</button></div></div><input type="file" id="fileIn" accept="image/*" multiple style="display:none" onchange="subirFotos()"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:20px;overflow-y:auto;flex:1">'+htmlFotos+'</div>';
  document.body.appendChild(visor);
}

window.clickPerfil = function(){
  if(!esAdmin){
    if(prompt("Contraseña:")===clave){ esAdmin=true; localStorage.setItem("admin_sesion","1"); abrirGaleria(); }
  } else {
    document.getElementById("fileIn").click();
  }
}
window.verFoto = function(i){ actual=i; mostrarFoto(); }
window.mostrarFoto = function(){
  var old = document.getElementById("visorFoto"); if(old) old.remove();
  var v = document.createElement("div"); v.id="visorFoto";
  v.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999999;display:flex;align-items:center;justify-content:center;";
  v.innerHTML = '<button onclick="cambiarFoto(-1)" style="position:absolute;left:15px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border:2px solid #fff;padding:15px;border-radius:50%;cursor:pointer">‹</button><img id="imgGrande" src="'+lista[actual]+'" style="max-width:80%;max-height:75%;border:2px solid #fff;border-radius:8px"><button onclick="cambiarFoto(1)" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border:2px solid #fff;padding:15px;border-radius:50%;cursor:pointer">›</button><button onclick="document.getElementById(&apos;visorFoto&apos;).remove()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:2px solid #fff;padding:8px 25px;cursor:pointer">X</button>';
  document.body.appendChild(v);
}
window.cambiarFoto = function(d){ actual+=d; if(actual<0) actual=lista.length-1; if(actual>=lista.length) actual=0; document.getElementById("imgGrande").src=lista[actual]; }
window.subirFotos = function(){
  var files = document.getElementById("fileIn").files;
  for(var k=0;k<files.length;k++){
    var r = new FileReader();
    r.onload = function(e){ lista.push(e.target.result); localStorage.setItem("fotos", JSON.stringify(lista)); abrirGaleria(); };
    r.readAsDataURL(files[k]);
  }
}
window.borrarFoto = function(i){ if(!esAdmin) return; if(confirm("¿Borrar?")){ lista.splice(i,1); localStorage.setItem("fotos", JSON.stringify(lista)); var f=document.getElementById("visorFoto"); if(f) f.remove(); abrirGaleria(); } }

var cont = document.getElementById('botonera');
listaBotones.forEach(function(b,i){
  var wrap=document.createElement('div'); wrap.className='boton-wrap';
  var mini=document.createElement('div'); mini.className='mini-left';
  mini.innerHTML='<img src="'+b.miniImg+'">';
  var enVid=false;
  mini.onclick=function(e){ e.stopPropagation(); mini.innerHTML=!enVid?'<video src="'+b.miniVideo+'" autoplay muted loop></video>':'<img src="'+b.miniImg+'">'; enVid=!enVid; };
  var btn=document.createElement('div'); btn.className='btn-img';
  btn.innerHTML='<img src="'+b.img+'">';
  if(b.tipo==='COMICS') btn.onclick=abrirComics; else if(b.tipo==='GALERIA') btn.onclick=abrirGaleria; else btn.onclick=function(){ if(b.link && b.link!=='#') window.location=b.link; };
  wrap.appendChild(mini); wrap.appendChild(btn); cont.appendChild(wrap);
  setTimeout(function(){ wrap.classList.add('entrar'); }, 2200 + i*90);
});
</script>

<script>
(function(){
  // === AQUI ANADES TUS MUSICAS, MAX 5 ===
  const SONGS = [
    "BOSSA.mp3",
    "LANDSCAPE.mp3",
    "EmbersCALL.mp3"
  ];

  // === IMAGENES DE BOTONES, PUEDES CAMBIARLAS ===
  const IMG_SOUND_ON = "https://cdn-icons-png.flaticon.com/512/138/138817.png";
  const IMG_SOUND_OFF = "https://cdn-icons-png.flaticon.com/512/64/64595.png";
  const IMG_NEXT = "https://cdn-icons-png.flaticon.com/512/138/138932.png";

  const player = document.getElementById("player");
  const btnMute = document.getElementById("btn-mute");
  const btnNext = document.getElementById("btn-next");

  let idx = 0;
  let clicks = 0;
  const MAX_CLICKS = 5; // maximo de cambios

  player.src = SONGS[0];
  player.volume = 0.6;
  player.loop = true; // loop infinito cada cancion

  // autoplay al primer click en la pagina
  document.addEventListener("click", function init(){
    player.play().catch(()=>{});
    document.removeEventListener("click", init);
  });

  btnMute.src = IMG_SOUND_ON;
  btnNext.src = IMG_NEXT;

  btnMute.addEventListener("click", function(){
    player.muted =!player.muted;
    btnMute.src = player.muted? IMG_SOUND_OFF : IMG_SOUND_ON;
  });

  btnNext.addEventListener("click", function(){
    if(clicks >= MAX_CLICKS) return;
    clicks++;
    idx = (idx + 1) % SONGS.length;
    player.src = SONGS[idx];
    player.play().catch(()=>{});
    if(clicks >= MAX_CLICKS){
      btnNext.style.opacity = "0.3";
      btnNext.style.pointerEvents = "none";
    }
  });

  // si quieres que cambie sola al terminar, quita player.loop = true y usa esto:
  // player.addEventListener("ended", ()=>{ btnNext.click(); });

})();
</script>

<script>
(function(){
  const PASS_F = "admin123";
  const MAX_IMG = 6;
  let imagenes = JSON.parse(localStorage.getItem("feed_imgs") || '["https://picsum.photos/300/300?1","https://picsum.photos/300/300?2","https://picsum.photos/300/300?3","https://picsum.photos/300/300?4"]');
  const cont = document.getElementById("feed-wrap");

  function render(){
    cont.innerHTML = "";
    imagenes.forEach((src)=>{
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `<img src="${src}" loading="lazy">`;
      cont.appendChild(div);
    });
  }
  render();
  cont.addEventListener("dblclick", openAdmin);
  function openAdmin(){
    if(prompt("Pass:") !== PASS_F) return;
    let op = prompt("1=agregar 2=borrar ultima 3=borrar todas | Total:"+imagenes.length+"/"+MAX_IMG);
    if(op==="1"){
      if(imagenes.length>=MAX_IMG){ alert("Max "+MAX_IMG); return; }
      let url = prompt("URL o archivo:");
      if(!url) return;
      imagenes.push(url.trim());
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="2"){
      imagenes.pop();
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="3"){
      imagenes=[];
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
  }
})();
</script>

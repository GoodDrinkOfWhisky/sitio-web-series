<div id="pj-wrap">
  <div style="position:relative; width:300px; height:300px">
    <img id="pj-gif" src="RENYA.gif" draggable="false">
    <video id="pj-video-char" muted loop playsinline></video>
  </div>
  <div style="display:flex; flex-direction:column">
    <div id="pj-globo"></div>
    <div id="pj-video-box"><video id="pj-video" muted loop playsinline></video></div>
  </div>
</div>

<script>
(function(){
  const PASS2 = "admin123";
  const CHAR_VIDEO = "renya_hablando.mp4"; // VIDEO DE RENYA HABLANDO LOOP
  const EXTRA_VIDEO = "video.mp4"; // video extra si quieres
  const AUDIO_SRC = "typing.mp3";

  let lista = JSON.parse(localStorage.getItem("frases") || '["Hola!, mucho gusto estoy aqui para brindarte consejos basicos","Mira la galeria","Esta diseñada para los fanarts"]');
  let pos=0, busy=false;

  const elGif=document.getElementById("pj-gif");
  const elCharVideo=document.getElementById("pj-video-char");
  const elGlobo=document.getElementById("pj-globo");
  const vBox=document.getElementById("pj-video-box");
  const vEl=document.getElementById("pj-video");
  elCharVideo.src=CHAR_VIDEO;
  vEl.src=EXTRA_VIDEO;

  const audio=new Audio(AUDIO_SRC); audio.loop=true;

  function ajustarFuente(t){
    let s=18; if(t.length>70)s=15; if(t.length>130)s=13; if(t.length>200)s=11.5;
    elGlobo.style.fontSize=s+"px";
  }

  function escribir(texto){
    if(busy) return;
    busy=true;

    // GIF -> VIDEO LOOP
    elGif.style.display="none";
    elCharVideo.style.display="block";
    elCharVideo.currentTime=0;
    elCharVideo.play().catch(()=>{});

    elGlobo.style.display="block";
    vBox.style.display="block";
    vEl.currentTime=0; vEl.play().catch(()=>{});
    elGlobo.textContent="";
    ajustarFuente(texto);

    audio.currentTime=0; audio.play().catch(()=>{});

    let i=0;
    let inter=setInterval(()=>{
      elGlobo.textContent+=texto[i]||""; i++;
      if(i>=texto.length){
        clearInterval(inter);
        audio.pause();

        // cuando acaba texto, video vuelve a ser gif
        elCharVideo.pause();
        elCharVideo.style.display="none";
        elGif.style.display="block";

        setTimeout(()=>{
          elGlobo.style.display="none";
          vBox.style.display="none";
          busy=false;
        }, 2500);
      }
    },28);
  }

  elGif.addEventListener("click",()=>{
    if(!lista.length) return;
    escribir(lista[pos]);
    pos=(pos+1)%lista.length;
  });

  let t=null;
  function startHold(){ t=setTimeout(openAdmin,1200); }
  function stopHold(){ clearTimeout(t); }
  elGif.addEventListener("mousedown",startHold);
  elGif.addEventListener("mouseup",stopHold);
  elGif.addEventListener("mouseleave",stopHold);
  elGif.addEventListener("touchstart",startHold,{passive:true});
  elGif.addEventListener("touchend",stopHold);

  function openAdmin(){
    if(prompt("Pass:")!==PASS2) return;
    let txt=prompt("Actuales:\n"+lista.join("\n")+"\n\nNuevo texto, vacio borra ultimo:");
    if(txt===null) return; txt=txt.trim();
    if(txt==="") lista.pop(); else lista.push(txt);
    localStorage.setItem("frases",JSON.stringify(lista));
  }
})();
</script>

<button id="btnGaleria">GALERÍA</button>

<script>
const PASS = "admin123";
let fotos = JSON.parse(localStorage.getItem("fotos") || "[]");
let admin = false;
let indiceActual = 0;

document.getElementById("btnGaleria").onclick = () => {
  document.getElementById("sonidoComics")?.play().catch(()=>{});
  abrirGaleria();
};

function abrirGaleria(){
  document.getElementById("visorComics")?.remove();
  let visor = document.createElement("div");
  visor.id = "visorComics";
  visor.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999999;display:flex;flex-direction:column;";

  let grid = fotos.map((src,i)=>`
    <div style="position:relative">
      <img src="${src}" onclick="verFoto(${i})" style="width:100%;height:220px;object-fit:cover;border:2px solid #fff;border-radius:8px;cursor:pointer">
      ${admin?`<button onclick="event.stopPropagation(); quitar(${i})" style="position:absolute;top:5px;right:5px;background:red;color:#fff;border:none;padding:5px 8px;cursor:pointer">X</button>`:""}
    </div>
  `).join("");

  visor.innerHTML = `
    <div style="height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;border-bottom:2px solid #fff;background:#000;flex-shrink:0">
      <b style="color:#fff">GALERÍA</b>
      <div style="display:flex;gap:10px">
        <button onclick="loginAdmin()" style="background:#fff;color:#000;border:none;padding:6px 12px;font-weight:bold;cursor:pointer">${admin?"ADMIN ON":"ADMIN"}</button>
        <button onclick="this.closest('#visorComics').remove()" style="background:#000;color:#fff;border:2px solid #fff;padding:6px 12px;cursor:pointer">CERRAR</button>
      </div>
    </div>
    ${admin?`<div style="padding:10px;display:flex;gap:10px;background:#111"><input type="file" id="fileIn" accept="image/*" multiple style="color:#fff"><button onclick="poner()" style="background:#fff;color:#000;font-weight:bold;padding:6px 15px;cursor:pointer">SUBIR</button></div>`:""}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding:20px;overflow-y:auto;background:#0a0a0a;flex:1">${grid || "<p style='color:#fff'>No hay fotos aún. Entra como admin para subir.</p>"}</div>
  `;
  document.body.appendChild(visor);
}

// === FUNCION PARA METERSE A LAS FOTOS ===
window.verFoto = (i)=>{
  indiceActual = i;
  mostrarFoto();
};

function mostrarFoto(){
  document.getElementById("visorFoto")?.remove();
  let v = document.createElement("div");
  v.id = "visorFoto";
  v.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999999;display:flex;align-items:center;justify-content:center;";

  v.innerHTML = `
    <button onclick="cambiarFoto(-1)" style="position:absolute;left:15px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border:2px solid #fff;padding:15px 18px;font-size:24px;cursor:pointer;border-radius:50%">‹</button>
    <img id="imgGrande" src="${fotos[indiceActual]}" style="max-width:80%;max-height:75%;border:2px solid #fff;box-shadow:0 0 30px #fff;border-radius:8px">
    <button onclick="cambiarFoto(1)" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);background:#000;color:#fff;border:2px solid #fff;padding:15px 18px;font-size:24px;cursor:pointer;border-radius:50%">›</button>
    <button onclick="document.getElementById('visorFoto').remove()" style="position:absolute;bottom:25px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:2px solid #fff;padding:10px 35px;font-weight:bold;cursor:pointer;border-radius:6px;box-shadow:0 0 15px #fff;letter-spacing:3px">X</button>
  `;
  document.body.appendChild(v);

  // Deslizar con el dedo
  let startX = 0;
  let img = v.querySelector("#imgGrande");
  img.addEventListener("touchstart", e => startX = e.touches[0].clientX, {passive:true});
  img.addEventListener("touchend", e => {
    let diff = e.changedTouches[0].clientX - startX;
    if(diff > 50) cambiarFoto(-1);
    if(diff < -50) cambiarFoto(1);
  });
}

window.cambiarFoto = (dir)=>{
  indiceActual += dir;
  if(indiceActual < 0) indiceActual = fotos.length - 1;
  if(indiceActual >= fotos.length) indiceActual = 0;
  document.getElementById("imgGrande").src = fotos[indiceActual];
}

window.loginAdmin = ()=>{
  if(prompt("Contraseña:") === PASS){ admin=true; abrirGaleria(); } else alert("Mal");
}
window.poner = ()=>{
  let files = document.getElementById("fileIn").files;
  for(let f of files){
    let r = new FileReader();
    r.onload = e => { fotos.push(e.target.result); localStorage.setItem("fotos", JSON.stringify(fotos)); abrirGaleria(); };
    r.readAsDataURL(f);
  }
}
window.quitar = (i)=>{
  fotos.splice(i,1); localStorage.setItem("fotos", JSON.stringify(fotos)); abrirGaleria();
}
</script>

<script>

const BOTONES = [
  { img:'img/b1.jpg',  miniImg:'img/m1.png', miniVideo:'videos/m1.mp4', link:'#' },
  { img:'img/b2.jpg',  miniImg:'img/m2.png', miniVideo:'videos/m2.mp4', link:'#' },

const cont=document.getElementById('botonera');

  const mini=document.createElement('div'); mini.className='mini-left';

  mini.onclick=(e)=>{
    e.stopPropagation();
    mini.innerHTML = !enVideo ? `<video src="${b.miniVideo}" autoplay muted loop></video>` : `<img src="${b.miniImg}">`;

  const btn=document.createElement('div'); btn.className='btn-img';
  btn.innerHTML=`<img src="${b.img}" onerror="this.parentElement.style.background='#555'">`;
  btn.onclick=()=>{ if(b.link!=='#') window.location=b.link };

  wrap.appendChild(mini); wrap.appendChild(btn);
  cont.appendChild(wrap);

  // ANIMACION DESPUES DE TU INTRO - 2.2 SEGUNDOS DESPUES
  setTimeout(()=>{ wrap.classList.add('entrar'); wrap.style.animationDelay=(i*0.1)+'s'; }, 2200 + i*90);
});

<audio id="player" loop></audio>

<script>
(function(){
  // === AQUI ANADES TUS MUSICAS, MAX 5 ===
  const SONGS = [
    "BOSSA.mp3",
    "LANDSCAPE.mp3",
    "EmbersCALL.mp3"
  ];

  // === IMAGENES DE BOTONES, PUEDES CAMBIARLAS ===
  const IMG_SOUND_ON = "https://cdn-icons-png.flaticon.com/512/138/138817.png";
  const IMG_SOUND_OFF = "https://cdn-icons-png.flaticon.com/512/64/64595.png";
  const IMG_NEXT = "https://cdn-icons-png.flaticon.com/512/138/138932.png";

  const player = document.getElementById("player");
  const btnMute = document.getElementById("btn-mute");
  const btnNext = document.getElementById("btn-next");

  let idx = 0;
  let clicks = 0;
  const MAX_CLICKS = 5; // maximo de cambios

  player.src = SONGS[0];
  player.volume = 0.6;
  player.loop = true; // loop infinito cada cancion

  // autoplay al primer click en la pagina
  document.addEventListener("click", function init(){
    player.play().catch(()=>{});
    document.removeEventListener("click", init);
  });

  btnMute.src = IMG_SOUND_ON;
  btnNext.src = IMG_NEXT;

  btnMute.addEventListener("click", function(){
    player.muted =!player.muted;
    btnMute.src = player.muted? IMG_SOUND_OFF : IMG_SOUND_ON;
  });

  btnNext.addEventListener("click", function(){
    if(clicks >= MAX_CLICKS) return;
    clicks++;
    idx = (idx + 1) % SONGS.length;
    player.src = SONGS[idx];
    player.play().catch(()=>{});
    if(clicks >= MAX_CLICKS){
      btnNext.style.opacity = "0.3";
      btnNext.style.pointerEvents = "none";
    }
  });

  // si quieres que cambie sola al terminar, quita player.loop = true y usa esto:
  // player.addEventListener("ended", ()=>{ btnNext.click(); });

})();
</script>

      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `<img src="${src}" loading="lazy">`;
      cont.appendChild(div);
    });
  }
  render();
  cont.addEventListener("dblclick", openAdmin);
  function openAdmin(){
    if(prompt("Pass:") !== PASS_F) return;
    let op = prompt("1=agregar 2=borrar ultima 3=borrar todas | Total:"+imagenes.length+"/"+MAX_IMG);
    if(op==="1"){
      if(imagenes.length>=MAX_IMG){ alert("Max "+MAX_IMG); return; }
      let url = prompt("URL o archivo:");
      if(!url) return;
      imagenes.push(url.trim());
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="2"){
      imagenes.pop();
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="3"){
      imagenes=[];
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
  }
})();
</script>

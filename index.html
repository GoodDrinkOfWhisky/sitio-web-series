<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:sans-serif}
#grid{display:flex;gap:12px;padding:20px;overflow-x:auto;overflow-y:hidden;align-items:start}
.comicBox{
 width:160px;
 height:calc(100vh - 88px);
 flex-shrink:0;
 border-radius:18px;
 position:relative;
 overflow:visible;
 z-index:1;
}
.comicBox:hover{z-index:20}
.comic-flaco{
 width:160px;
 height:100%;
 border-radius:18px;
 overflow:hidden;
 border:1.5px solid #222;
 position:relative;
 background:#111;
}
.comicBox:hover.comic-flaco{
 width:460px;
 border-color:#fff;
 box-shadow:0 15px 50px rgba(0,0,0,0.9);
}
.portada-flaca{width:100%;height:100%;object-fit:cover;position:absolute;left:0;top:0}
.portada-ancha{width:100%;height:100%;object-fit:cover;position:absolute;left:0;top:0;display:none}
.comicBox:hover.portada-flaca{display:none}
.comicBox:hover.portada-ancha{display:block}

/* FORM */
.form-row{display:flex;gap:12px;padding:20px}
.form-group{flex:1}
.form-group label{display:block;margin-bottom:6px;font-size:12px;opacity:0.7}
.file-input{width:100%;padding:8px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff}
#preview{padding:0 20px 20px;font-size:12px;opacity:0.5}
</style>
</head>
<body>

<div class="form-row">
  <div class="form-group">
    <label>Portada Flaca (160px)</label>
    <input type="file" id="flacaInput" accept="image/*" class="file-input">
  </div>
  <div class="form-group">
    <label>Portada Ancha (460px)</label>
    <input type="file" id="anchaInput" accept="image/*" class="file-input">
  </div>
</div>
<div id="preview"></div>
<div id="grid"></div>

<script>
let tempFlaca=null;
let tempPortada=null;
let comics=JSON.parse(localStorage.getItem("comics")||"[]");

async function comprimirImagen(src, anchoMax){
 return new Promise(res=>{
  let img=new Image();
  img.onload=()=>{
   let ratio=anchoMax/img.width;
   let w=anchoMax;
   let h=img.height*ratio;
   let c=document.createElement("canvas");
   c.width=w; c.height=h;
   let x=c.getContext("2d");
   x.imageSmoothingQuality="high";
   x.drawImage(img,0,0,w,h);
   res(c.toDataURL("image/webp",0.85));
  };
  img.src=src;
 });
}

function renderSeccion(){
 let grid=document.getElementById("grid");
 grid.innerHTML="";
 comics.forEach(c=>{
  grid.innerHTML+=`
  <div class="comicBox">
   <div class="comic-flaco">
    <img class="portada-flaca" src="${c.flaca}">
    <img class="portada-ancha" src="${c.portada}">
   </div>
  </div>`;
 });
 if(tempFlaca && tempPortada){
  comics.push({flaca:tempFlaca, portada:tempPortada});
  localStorage.setItem("comics", JSON.stringify(comics));
  tempFlaca=null; tempPortada=null;
  document.getElementById("preview").innerText="Guardado - "+comics.length+" comics";
  setTimeout(renderSeccion,100);
 }
}

document.getElementById("flacaInput").addEventListener("change", async function(){
 let f=this.files[0]; if(!f) return;
 let r=new FileReader();
 r.onload=async e=>{
  tempFlaca=await comprimirImagen(e.target.result, 160);
  document.getElementById("preview").innerText="Flaca lista - ahora sube la ancha";
  renderSeccion();
 };
 r.readAsDataURL(f);
});

document.getElementById("anchaInput").addEventListener("change", async function(){
 let f=this.files[0]; if(!f) return;
 let r=new FileReader();
 r.onload=async e=>{
  tempPortada=await comprimirImagen(e.target.result, 460);
  if(!tempFlaca) tempFlaca=await comprimirImagen(e.target.result, 160);
  renderSeccion();
 };
 r.readAsDataURL(f);
});

renderSeccion();
</script>
</body>
</html>

<style>
/* BOTON CENTRO GOTH */
#mac-open-btn{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  z-index:99997; width:420px; max-width:88vw; height:62px;
  background:linear-gradient(110deg, rgba(10,10,10,0.75), rgba(40,40,40,0.75), rgba(10,10,10,0.75));
  background-size:300% 300%;
  backdrop-filter:blur(10px) saturate(1.1);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:16px;
  color:#8a8a8a;
  font-family:'Cinzel', serif;
  font-size:18px; letter-spacing:5px; text-transform:uppercase;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:14px;
  animation: shineMove 5s linear infinite, borderPulse 3.5s ease-in-out infinite;
  box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
  transition:.35s;
}
#mac-open-btn:hover{
  color:#fff; border-color:rgba(255,255,255,0.95);
  box-shadow: inset 0 0 30px rgba(255,255,255,0.08), 0 0 30px rgba(255,255,255,0.55), 0 0 60px rgba(255,255,255,0.15);

}

@keyframes shineMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes borderPulse{0%,100%{border-color:rgba(255,255,255,0.15)}50%{border-color:rgba(255,255,255,0.4)}}

/* VENTANA MAC MONOCROMATICA */

#mac-win{background:rgba(14,14,14,0.94);border-radius:16px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#mac-bar{height:40px;background:linear-gradient(90deg,#151515,#2a2a2a);display:flex;align-items:center;padding:0 14px;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);cursor:move}
#mac-dots{display:flex;gap:8px}.dot{width:11px;height:11px;border-radius:50%;cursor:pointer}.dot.r{background:#2a2a2a;border:1px solid #444}.dot.y{background:#2a2a2a;border:1px solid #444}.dot.g{background:#2a2a2a;border:1px solid #444}

.xbox-tile{

#mac-foot{display:flex;justify-content:space-between;padding:12px 14px;background:#161616;border-top:1px solid rgba(255,255,255,0.06)}
.mac-btn{background:#222;color:#aaa;border:1px solid #333;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Cinzel',serif;letter-spacing:2px;transition:.2s}

</style>

<script>
const MAC_PASS="admin123";
const LINK_KEY="xbox_links_v1";
let links = JSON.parse(localStorage.getItem(LINK_KEY) || '{"tiktok":"","discord":"","youtube":"","insta":""}');
let macEditable=false;
function abrirMac(){ document.getElementById("mac-wrap").style.display="block"; }
function cerrarMac(){ document.getElementById("mac-wrap").style.display="none"; }
function openLink(t){ if(macEditable) return; const u=links[t]; if(!u) return alert("Sin link para "+t); window.open(u,"_blank"); }
function toggleEdit(){
  const panel=document.getElementById("mac-edit-panel"), btn=document.getElementById("mac-edit-btn");
  if(!macEditable){
    if(prompt("Pass:")!==MAC_PASS) return;
    macEditable=true; panel.style.display="block";
    document.getElementById("inp-tiktok").value=links.tiktok;
    document.getElementById("inp-discord").value=links.discord;
    document.getElementById("inp-youtube").value=links.youtube;
    document.getElementById("inp-insta").value=links.insta;
    btn.textContent="GUARDAR"; btn.style.color="white"; btn.style.borderColor="white";
  }else{
    links.tiktok=document.getElementById("inp-tiktok").value.trim();
    links.discord=document.getElementById("inp-discord").value.trim();
    links.youtube=document.getElementById("inp-youtube").value.trim();
    links.insta=document.getElementById("inp-insta").value.trim();
    localStorage.setItem(LINK_KEY, JSON.stringify(links));
    macEditable=false; panel.style.display="none"; btn.textContent="EDITAR"; btn.style.color=""; btn.style.borderColor=""; alert("Guardado!");
  }
}
(function(){
  const bar=document.getElementById("mac-bar"), wrap=document.getElementById("mac-wrap");
  let down=false,sx,sy,il,it;
  bar.addEventListener("mousedown",e=>{down=true;const r=wrap.getBoundingClientRect();il=r.left;it=r.top;sx=e.clientX;sy=e.clientY;});
  window.addEventListener("mousemove",e=>{if(!down)return;wrap.style.left=(il+e.clientX-sx+wrap.offsetWidth/2)+"px";wrap.style.top=(it+e.clientY-sy+wrap.offsetHeight/2)+"px";});
  window.addEventListener("mouseup",()=>down=false);
})();
</script>

<div id="pj-wrap">
  <div id="pj-globo"></div>
  <video id="pj-video-idle" autoplay loop muted playsinline></video>
  <video id="pj-video-talk" loop muted playsinline style="display:none"></video>
</div>

<script>
(function(){
  const PASS2 = "admin123";
  const VIDEO_QUIETA = "RENYA.mp4";
  const VIDEO_HABLANDO = "RENYATALKS.mp4";

  let lista = JSON.parse(localStorage.getItem("frases") || '["Hola!, mucho gusto estoy aqui para brindarte consejos basicos","Mira la galeria","Esta diseñada para los fanarts","tambien puedes apoyar el contenido al visitar las demas redes sociales, los links se encuentran abajo","este sitio se encuentra en una fase muy temprana asi que no hay mucho que hacer por ahora lo siento..."]');
  let pos=0, busy=false;

  const elIdle = document.getElementById("pj-video-idle");
  const elTalk = document.getElementById("pj-video-talk");
  const elGlobo = document.getElementById("pj-globo");

  elIdle.src = VIDEO_QUIETA;
  elTalk.src = VIDEO_HABLANDO;
  elIdle.load(); elTalk.load();
  elIdle.play().catch(()=>{});

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beepOriginal(){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='square';
    o.frequency.value = 185 + Math.random()*12;
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.13);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.13);
  }

  function ajustarFuente(t){
    let s=18; if(t.length>70)s=15; if(t.length>130)s=13; if(t.length>200)s=11.5;
    elGlobo.style.fontSize=s+"px";
  }

  function escribir(texto){
    if(busy) return;
    busy=true;
    if(audioCtx.state==='suspended') audioCtx.resume();
    elIdle.style.display="none"; elIdle.pause();
    elTalk.style.display="block"; elTalk.currentTime=0; elTalk.play().catch(()=>{});
    elGlobo.style.display="block"; elGlobo.textContent=""; ajustarFuente(texto);
    let i=0;
    let inter=setInterval(()=>{
      elGlobo.textContent+=texto[i]||"";
      if(texto[i] && texto[i]!=" " && i%2==0) beepOriginal();
      i++;
      if(i>=texto.length){
        clearInterval(inter);
        elTalk.pause(); elTalk.style.display="none";
        elIdle.style.display="block"; elIdle.play().catch(()=>{});
        setTimeout(()=>{ elGlobo.style.display="none"; busy=false; },2500);
      }
    },28);
  }

  function siguienteFrase(){
    if(busy ||!lista.length) return;
    escribir(lista[pos]);
    pos=(pos+1)%lista.length;
  }
  elIdle.addEventListener("click", siguienteFrase);
  elTalk.addEventListener("click", siguienteFrase);

  let t=null;
  function startHold(){ t=setTimeout(openAdmin,1200); }
  function stopHold(){ clearTimeout(t); }
  elIdle.addEventListener("mousedown",startHold);
  elIdle.addEventListener("mouseup",stopHold);
  elIdle.addEventListener("mouseleave",stopHold);
  elIdle.addEventListener("touchstart",startHold,{passive:true});
  elIdle.addEventListener("touchend",stopHold);

  function openAdmin(){
    if(prompt("Pass:")!==PASS2) return;
    let txt=prompt("Actuales:\n"+lista.join("\n")+"\n\nNuevo texto, vacio borra ultimo:");
    if(txt===null) return; txt=txt.trim();
    if(txt==="") lista.pop(); else lista.push(txt);
    localStorage.setItem("frases",JSON.stringify(lista));
  }
})();
</script>

<script>
var CLAVE="admin123";
var lista=JSON.parse(localStorage.getItem("fotos")||"[]");
var comicsLista=JSON.parse(localStorage.getItem("comicsLista")||"[]");
var miFoto=localStorage.getItem("mi_foto_perfil")||"img/perfil.jpg";
var esAdmin=localStorage.getItem("admin_sesion")==="1";
var editIndex=-1, paginaActual=0, comicActual=null;

if(comicsLista.length===0){
 comicsLista=[
  {flaca:'img/comic1_flaco.jpg', portada:'img/comic1.jpg', paginas:['img/comic1.jpg','img/comic1_p2.jpg','img/comic1_p3.jpg']},
  {flaca:'img/comic2_flaco.jpg', portada:'img/comic2.jpg', paginas:['img/comic2.jpg','img/comic2_p2.jpg']}
 ];
}

function modal(h){ var m=document.getElementById("modalBox"); m.innerHTML=h; m.style.display="flex"; }
function cerrar(){ document.getElementById("modalBox").style.display="none"; }

function abrirComics(){
 document.getElementById("visorComics")?.remove();
 var v=document.createElement("div"); v.id="visorComics";
 var comicsHtml="";
 for(var i=0;i<comicsLista.length;i++){
   comicsHtml+='<div class="comic-flaco" data-i="'+i+'"><img class="portada-flaca" src="'+comicsLista[i].flaca+'" onerror="this.src=\''+comicsLista[i].portada+'\'"><img class="portada-ancha" src="'+comicsLista[i].portada+'"></div>';
 }
 var masHtml = esAdmin? '<div class="marco-mas" onclick="pedirNuevoComic()"><span style="color:#fff;font-size:48px;font-weight:800">+</span></div>' : '';
 v.innerHTML='<div style="height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#000;border-bottom:2px solid #222;flex-shrink:0"><b style="color:#fff;letter-spacing:3px">BIBLIOTECA</b><div style="display:flex;gap:10px"><div id="perfilBtnComics" style="width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;cursor:pointer"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div></div></div><input type="file" id="filePerfilComics" style="display:none"><div style="display:flex;gap:16px;padding:16px;overflow:auto;flex:1;align-items:center">'+comicsHtml+masHtml+'</div>';
 document.body.appendChild(v);
 document.getElementById("perfilBtnComics").onclick=clickPerfilComics;
 document.getElementById("filePerfilComics").onchange=function(){ var f=this.files[0]; var r=new FileReader(); r.onload=function(e){ miFoto=e.target.result; localStorage.setItem("mi_foto_perfil", miFoto); cerrar(); abrirComics(); }; r.readAsDataURL(f); };
 document.querySelectorAll(".comic-flaco").forEach(function(card){ card.onclick=function(){ var i=parseInt(this.getAttribute("data-i")); abrirLector(i); }; });
}

function clickPerfilComics(){
 if(!esAdmin){
   modal('<div class="modal"><h3 style="color:#fff">CONTRASEÑA</h3><input id="pass" type="password" style="width:100%;padding:12px;background:#000;color:#fff;border:2px solid #333;border-radius:8px;margin-top:10px"><button style="width:100%;padding:12px;background:#fff;color:#000;border-radius:8px;margin-top:10px;font-weight:bold" onclick="if(document.getElementById(\'pass\').value===\'admin123\'){esAdmin=true; localStorage.setItem(\'admin_sesion\',\'1\'); cerrar(); abrirComics()}">ENTRAR</button></div>');
 } else {
   modal('<div class="modal"><div style="width:80px;height:80px;border-radius:50%;border:3px solid #fff;overflow:hidden;margin:0 auto"><img src="'+miFoto+'" style="width:100%;height:100%;object-fit:cover"></div><h3 style="color:#fff;margin-top:10px">MI PERFIL</h3><button style="width:100%;padding:12px;background:#000;color:#fff;border:2px solid #333;border-radius:8px;margin-top:8px" onclick="cerrar(); document.getElementById(\'filePerfilComics\').click()">CAMBIAR MI FOTO</button><button style="width:100%;padding:12px;background:#fff;color:#000;border-radius:8px;font-weight:bold;margin-top:10px" onclick="cerrar(); pedirNuevoComic()">+ AÑADIR CÓMIC</button><button style="width:100%;padding:12px;background:#000;color:#ff5555;border:2px solid #331111;border-radius:8px;margin-top:8px" onclick="esAdmin=false; localStorage.removeItem(\'admin_sesion\'); cerrar(); abrirComics()">SALIR</button></div>');
 }
}

var tempFlaca="", tempPortada="";
function pedirNuevoComic(){
 modal('<div class="modal"><h3 style="color:#fff">NUEVO CÓMIC</h3><input type="file" id="f1" accept="image/*" style="display:none"><input type="file" id="f2" accept="image/*" multiple style="display:none"><button style="width:100%;padding:10px;background:#111;color:#fff;border:2px solid #333;border-radius:8px;margin-top:8px" onclick="document.getElementById(\'f1\').click()">1. PORTADA FLACA</button><button style="width:100%;padding:10px;background:#111;color:#fff;border:2px solid #333;border-radius:8px;margin-top:8px" onclick="document.getElementById(\'f2\').click()">2. PÁGINAS DEL CÓMIC</button><button style="width:100%;padding:12px;background:#fff;color:#000;border-radius:8px;margin-top:12px;font-weight:bold" onclick="if(tempFlaca&&tempPortada){comicsLista.push({flaca:tempFlaca,portada:tempPortada,paginas:tempPaginas}); localStorage.setItem(\'comicsLista\',JSON.stringify(comicsLista)); tempFlaca=\'\'; tempPortada=\'\'; tempPaginas=[]; cerrar(); abrirComics()}">GUARDAR</button></div>');
 setTimeout(function(){
   window.tempPaginas=[];
   document.getElementById("f1").onchange=function(){ var r=new FileReader(); r.onload=function(e){ tempFlaca=e.target.result; tempPortada=e.target.result; }; r.readAsDataURL(this.files[0]); };
   document.getElementById("f2").onchange=function(){ var files=this.files; var c=0; tempPaginas=[]; for(var k=0;k<files.length;k++){ var r=new FileReader(); r.onload=function(e){ tempPaginas.push(e.target.result); c++; if(c===1) tempPortada=e.target.result; }; r.readAsDataURL(files[k]); } };
 },100);
}

function abrirLector(i){

<script>
(function(){
  // === AQUI ANADES TUS MUSICAS, MAX 5 ===
  const SONGS = [
    "BOSSA.mp3",
    "LANDSCAPE.mp3",
    "EmbersCALL.mp3"
  ];

  // === IMAGENES DE BOTONES, PUEDES CAMBIARLAS ===
  const IMG_SOUND_ON = "https://cdn-icons-png.flaticon.com/512/138/138817.png";
  const IMG_SOUND_OFF = "https://cdn-icons-png.flaticon.com/512/64/64595.png";
  const IMG_NEXT = "https://cdn-icons-png.flaticon.com/512/138/138932.png";

  const player = document.getElementById("player");
  const btnMute = document.getElementById("btn-mute");
  const btnNext = document.getElementById("btn-next");

  let idx = 0;
  let clicks = 0;
  const MAX_CLICKS = 5; // maximo de cambios

  player.src = SONGS[0];
  player.volume = 0.6;
  player.loop = true; // loop infinito cada cancion

  // autoplay al primer click en la pagina
  document.addEventListener("click", function init(){
    player.play().catch(()=>{});
    document.removeEventListener("click", init);
  });

  btnMute.src = IMG_SOUND_ON;
  btnNext.src = IMG_NEXT;

  btnMute.addEventListener("click", function(){
    player.muted =!player.muted;
    btnMute.src = player.muted? IMG_SOUND_OFF : IMG_SOUND_ON;
  });

  btnNext.addEventListener("click", function(){
    if(clicks >= MAX_CLICKS) return;
    clicks++;
    idx = (idx + 1) % SONGS.length;
    player.src = SONGS[idx];
    player.play().catch(()=>{});
    if(clicks >= MAX_CLICKS){
      btnNext.style.opacity = "0.3";
      btnNext.style.pointerEvents = "none";
    }
  });

  // si quieres que cambie sola al terminar, quita player.loop = true y usa esto:
  // player.addEventListener("ended", ()=>{ btnNext.click(); });

})();
</script>

<script>
(function(){
  const PASS_F = "admin123";
  const MAX_IMG = 6;
  let imagenes = JSON.parse(localStorage.getItem("feed_imgs") || '["https://picsum.photos/300/300?1","https://picsum.photos/300/300?2","https://picsum.photos/300/300?3","https://picsum.photos/300/300?4"]');
  const cont = document.getElementById("feed-wrap");

  function render(){
    cont.innerHTML = "";
    imagenes.forEach((src)=>{
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `<img src="${src}" loading="lazy">`;
      cont.appendChild(div);
    });
  }
  render();
  cont.addEventListener("dblclick", openAdmin);
  function openAdmin(){
    if(prompt("Pass:") !== PASS_F) return;
    let op = prompt("1=agregar 2=borrar ultima 3=borrar todas | Total:"+imagenes.length+"/"+MAX_IMG);
    if(op==="1"){
      if(imagenes.length>=MAX_IMG){ alert("Max "+MAX_IMG); return; }
      let url = prompt("URL o archivo:");
      if(!url) return;
      imagenes.push(url.trim());
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="2"){
      imagenes.pop();
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
    if(op==="3"){
      imagenes=[];
      localStorage.setItem("feed_imgs", JSON.stringify(imagenes));
      render();
    }
  }
})();
</script>

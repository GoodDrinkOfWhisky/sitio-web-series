<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#000;color:#fff;font-family:sans-serif}
  #topBar{height:50px;background:#000;display:flex;align-items:center;padding:0 15px;border-bottom:2px solid #fff}
  #contenido{padding:20px;min-height:80vh;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
  #closeX{position:fixed;top:6px;right:12px;z-index:99999;width:40px;height:40px;border-radius:50%;background:#000;color:#fff;border:2px solid #fff;cursor:pointer;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center}
  #adminDot{position:fixed;top:6px;right:62px;z-index:99999;width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;cursor:pointer;background:#111}
  #cropModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000000;display:none;align-items:center;justify-content:center;flex-direction:column}
  #cropArea{width:320px;height:320px;background:#888;position:relative;overflow:hidden;border-radius:16px;touch-action:none}
  #cropImage{position:absolute;top:0;left:0;cursor:grab;max-width:none;user-select:none;will-change:transform}
  #cropCircle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,0.6),0 0 15px #fff;pointer-events:none}
  #loginModal,#menuPerfil{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000002;display:none;align-items:center;justify-content:center}
  #loginBox,#menuBox{background:#111;border:1px solid #333;border-radius:20px;padding:24px;width:90%;max-width:320px;text-align:center}
  #modalComic{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:1000003;display:none;align-items:center;justify-content:center}
  #modalComicBox{background:rgba(18,18,18,0.92);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;width:95%;max-width:850px;height:80vh;display:flex;overflow:hidden;position:relative}
 .leftPreview{flex:1;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
 .rightControls{position:absolute;top:18px;right:18px;width:220px;display:flex;flex-direction:column;gap:12px;z-index:5}
 .steamFrame{width:200px;height:300px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.03);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;overflow:hidden}
 .steamFrame:hover{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,0.4);background:rgba(255,255,255,0.06)}
 .steamFrame:hover span{color:#fff;text-shadow:0 0 10px #fff}
 .steamFrame img{width:100%;height:100%;object-fit:cover}
 .steamLabel{font-size:12px;letter-spacing:1px;opacity:0.5;margin-top:8px;transition:all 0.3s;text-align:center}
 .plus{font-size:48px;font-weight:100;opacity:0.3;transition:all 0.3s}
 .controlBtn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);padding:12px;border-radius:8px;cursor:pointer;text-align:left;transition:all 0.3s;letter-spacing:0.5px}
 .controlBtn:hover,.controlBtn.active{background:rgba(255,255,255,0.1);border-color:#fff;color:#fff;box-shadow:0 0 15px rgba(255,255,255,0.3);text-shadow:0 0 8px #fff}
  #tituloInput{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:12px;border-radius:8px;width:100%;box-sizing:border-box;outline:none}
  #tituloInput:focus{border-color:#fff}
  #paginasView{display:none;flex-direction:column;height:100%;width:100%}
  #galeriaPaginas{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px;overflow-y:auto;max-height:320px;padding:10px 5px;align-content:start;width:100%}
 .paginaThumb{width:100px;height:140px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;position:relative}
 .paginaThumb img{width:100%;height:100%;object-fit:cover}
 .addPageCard{width:100px;height:140px;border:1px dashed rgba(255,255,255,0.2);background:rgba(255,255,255,0.02);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s}
 .addPageCard:hover{border-color:#fff;background:rgba(255,255,255,0.06);box-shadow:0 0 15px rgba(255,255,255,0.25)}
 .btn{width:100%;padding:11px;border-radius:10px;border:1px solid #fff;background:#000;color:#fff;cursor:pointer;margin-top:8px;font-weight:bold}
 .comicItem{border:1px solid rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;background:#0e0e0e;cursor:pointer;transition:0.3s}
 .comicItem:hover{box-shadow:0 0 20px rgba(255,255,255,0.2)}
 .comicItem img{width:100%;aspect-ratio:2/3;object-fit:cover}
</style>
</head>
<body>

<button id="closeX" onclick="cerrarComics()">X</button>
<img id="adminDot" onclick="clickPerfil()">
<div id="topBar">CÓMICS</div>
<div id="contenido"></div>

<div id="cropModal">
  <div id="cropArea"><img id="cropImage"><div id="cropCircle"></div></div>
  <div style="width:320px;margin-top:12px"><input type="range" id="zoom" style="width:100%"><input type="file" id="fileInput" accept="image/*" style="display:none"><button class="btn" onclick="fileInput.click()">Elegir imagen</button><button class="btn" onclick="guardarRecorte()">Guardar foto</button><button class="btn" style="opacity:0.5" onclick="cerrarEditor()">Cerrar</button></div>
  <canvas id="canvas" width="400" height="400" style="display:none"></canvas>
</div>

<div id="loginModal" onclick="if(event.target==this) cerrarLogin()"><div id="loginBox"><h3>Admin</h3><input id="emailLogin" value="lxvtorres@gmail.com" readonly style="opacity:0.5;width:100%;padding:10px;margin-top:8px;border-radius:8px;background:#000;border:1px solid #444;color:#fff"><input id="passLogin" type="password" placeholder="Contraseña" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;background:#000;border:1px solid #444;color:#fff"><button class="btn" onclick="intentarLogin()">Entrar</button><p id="loginError" style="color:#ff4444;display:none">Incorrecta</p></div></div>
<div id="menuPerfil" onclick="if(event.target==this) cerrarMenu()"><div id="menuBox"><img id="menuFoto" style="width:70px;height:70px;border-radius:50%;border:2px solid #fff"><h3>Mi perfil</h3><button class="btn" onclick="abrirEditor();cerrarMenu()">Editar foto</button><button class="btn" onclick="abrirModalComic();cerrarMenu()">Agregar cómic</button><button class="btn" style="background:#222" onclick="cerrarSesionAdmin()">Cerrar sesión</button><button class="btn" style="opacity:0.5" onclick="cerrarMenu()">Cancelar</button></div></div>

<div id="modalComic" onclick="if(event.target==this) cerrarModalComic()">
  <div id="modalComicBox">
    <div class="leftPreview">
      <div id="portadaView" style="display:flex;flex-direction:column;align-items:center"><div class="steamFrame" id="framePortada" onclick="document.getElementById('inputPortada').click()"><div style="text-align:center"><div class="plus">+</div><span class="steamLabel">AGREGAR PORTADA<br>ABAJO</span></div></div><p id="previewTitulo" style="margin-top:15px;opacity:0.5;letter-spacing:1px;font-size:13px">SIN TÍTULO</p></div>
      <div id="paginasView"><h4 style="margin:0 0 10px;opacity:0.6;letter-spacing:1px">PÁGINAS</h4><div id="galeriaPaginas"></div></div>
    </div>
    <div class="rightControls">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;opacity:0.5;letter-spacing:1px">EDITOR</span><span onclick="cerrarModalComic()" style="cursor:pointer;opacity:0.7">✕</span></div>
      <div><label style="font-size:10px;opacity:0.5">TITULO:</label><input id="tituloInput" placeholder="..." oninput="document.getElementById('previewTitulo').innerText=this.value.toUpperCase()||'SIN TÍTULO'"></div>
      <button class="controlBtn active" id="btnPortada" onclick="mostrarTab('portada')">PORTADA</button>
      <button class="controlBtn" id="btnPaginas" onclick="mostrarTab('paginas')">PAGINAS</button>
      <button class="btn" style="background:#fff;color:#000;margin-top:15px" onclick="guardarComicFinal()">GUARDAR CÓMIC</button>
      <button class="btn" style="opacity:0.4" onclick="cerrarModalComic()">CANCELAR</button>
    </div>
  </div>
</div>

<input type="file" id="inputPortada" accept="image/*" style="display:none">
<input type="file" id="inputPagina" accept="image/*" multiple style="display:none">

<script>
const ADMIN_EMAIL="lxvtorres@gmail.com";
const adminDot=document.getElementById('adminDot');
adminDot.src=localStorage.getItem('adminPerfilComics')||'https://i.imgur.com/8Km9tLL.png';

// FIX X - AHORA SI CIERRA SIEMPRE
function cerrarComics(){
  window.parent.postMessage("CERRAR_COMICS","*");
  try{
    const visor=window.parent.document.getElementById("visorComics");
    if(visor) visor.remove();
  }catch(e){}
  document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff">Cerrado</div>';
}

let eCount=0,eTimer=null;
window.addEventListener('keydown', ev=>{ if(ev.key.toLowerCase()==='e'){ eCount++; clearTimeout(eTimer); eTimer=setTimeout(()=>eCount=0,800); if(eCount===3){eCount=0;clickPerfil();}}});
function clickPerfil(){ if(localStorage.getItem('sesionAdmin')!=='true'){document.getElementById('loginModal').style.display='flex';} else {document.getElementById('menuFoto').src=adminDot.src;document.getElementById('menuPerfil').style.display='flex';}}
function cerrarMenu(){document.getElementById('menuPerfil').style.display='none';}
function cerrarLogin(){document.getElementById('loginModal').style.display='none';}
function intentarLogin(){const p=document.getElementById('passLogin').value.trim(); if(!p)return; let s=localStorage.getItem('adminPass'); if(!s){localStorage.setItem('adminPass',p);s=p;} if(p===s && document.getElementById('emailLogin').value.toLowerCase()===ADMIN_EMAIL){localStorage.setItem('sesionAdmin','true');cerrarLogin();} else document.getElementById('loginError').style.display='block';}
function cerrarSesionAdmin(){localStorage.removeItem('sesionAdmin');cerrarMenu();}

// FOTO
const cropModal=document.getElementById('cropModal'),cropArea=document.getElementById('cropArea'),cropImg=document.getElementById('cropImage'),zoom=document.getElementById('zoom'),fileInput=document.getElementById('fileInput');
let pos={x:0,y:0,scale:0.2,sx:0,sy:0,drag:false}; zoom.min=0.05; zoom.max=1.2; zoom.step=0.005; zoom.value=0.2;
function abrirEditor(){cropModal.style.display='flex';cropImg.src=adminDot.src;setTimeout(centerImage,100);}
function cerrarEditor(){cropModal.style.display='none';}
function centerImage(){pos.scale=0.2;zoom.value=0.2;const w=cropImg.naturalWidth*pos.scale,h=cropImg.naturalHeight*pos.scale;pos.x=(cropArea.clientWidth-w)/2;pos.y=(cropArea.clientHeight-h)/2;update();}
function update(){cropImg.style.transform=`translate3d(${pos.x}px, ${pos.y}px, 0) scale(${pos.scale})`;}
fileInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{cropImg.src=ev.target.result;cropImg.onload=centerImage};r.readAsDataURL(f);};
zoom.oninput=()=>{pos.scale=parseFloat(zoom.value);update();};
cropImg.addEventListener('mousedown',e=>{pos.drag=true;pos.sx=e.clientX-pos.x;pos.sy=e.clientY-pos.y;e.preventDefault();});
window.addEventListener('mousemove',e=>{if(!pos.drag)return;pos.x=e.clientX-pos.sx;pos.y=e.clientY-pos.sy;update();});
window.addEventListener('mouseup',()=>pos.drag=false);
cropImg.addEventListener('touchstart',e=>{pos.drag=true;pos.sx=e.touches[0].clientX-pos.x;pos.sy=e.touches[0].clientY-pos.y;},{passive:false});
window.addEventListener('touchmove',e=>{if(!pos.drag)return;e.preventDefault();pos.x=e.touches[0].clientX-pos.sx;pos.y=e.touches[0].clientY-pos.sy;update();},{passive:false});
window.addEventListener('touchend',()=>pos.drag=false);
function guardarRecorte(){const c=document.getElementById('canvas'),ctx=c.getContext('2d'),size=400,R=90,cx=cropArea.clientWidth/2,cy=cropArea.clientHeight/2,sf=size/(R*2);ctx.clearRect(0,0,size,size);ctx.save();ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();const w=cropImg.naturalWidth*pos.scale*sf,h=cropImg.naturalHeight*pos.scale*sf,x=(pos.x-(cx-R))*sf+size/2-R*sf,y=(pos.y-(cy-R))*sf+size/2-R*sf;ctx.drawImage(cropImg,x,y,w,h);ctx.restore();const d=c.toDataURL('image/png');localStorage.setItem('adminPerfilComics',d);adminDot.src=d;cerrarEditor();}

// COMICS FIX GUARDAR
let tempPortada=null,tempPaginas=[];
function abrirModalComic(){document.getElementById('modalComic').style.display='flex';mostrarTab('portada');}
function cerrarModalComic(){document.getElementById('modalComic').style.display='none';}
function mostrarTab(t){
  document.getElementById('portadaView').style.display=t==='portada'?'flex':'none';
  document.getElementById('paginasView').style.display=t==='paginas'?'flex':'none';
  document.getElementById('btnPortada').classList.toggle('active',t==='portada');
  document.getElementById('btnPaginas').classList.toggle('active',t==='paginas');
  if(t==='paginas') renderGaleria();
}
document.getElementById('inputPortada').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{tempPortada=ev.target.result;document.getElementById('framePortada').innerHTML=`<img src="${tempPortada}">`;}; r.readAsDataURL(f);
});
document.getElementById('inputPagina').addEventListener('change', e=>{
  const files=Array.from(e.target.files); if(!files.length) return;
  let c=0; files.forEach(f=>{const r=new FileReader(); r.onload=ev=>{tempPaginas.push(ev.target.result); c++; if(c===files.length) renderGaleria();}; r.readAsDataURL(f);});
});
function renderGaleria(){
  const g=document.getElementById('galeriaPaginas'); g.innerHTML='';
  tempPaginas.forEach((src,i)=>{g.innerHTML+=`<div class="paginaThumb"><img src="${src}"><span onclick="event.stopPropagation();tempPaginas.splice(${i},1);renderGaleria()" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.8);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#fff">x</span></div>`;});
  g.innerHTML+=`<div class="addPageCard" onclick="document.getElementById('inputPagina').click()"><div class="plus" style="font-size:30px">+</div><span style="font-size:10px;opacity:0.5">AGREGAR PÁGINA</span></div>`;
}
let comics=JSON.parse(localStorage.getItem('misComics')||'[]');
function renderComics(){
  const cont=document.getElementById('contenido'); cont.innerHTML=comics.length?'':'<p style="opacity:0.3;grid-column:1/-1">Sin cómics. Presiona EEE</p>';
  comics.forEach((c,i)=>{cont.innerHTML+=`<div class="comicItem" onclick="abrirComic(${i})"><img src="${c.portada}"><div style="padding:8px"><p style="margin:0;font-size:13px">${c.titulo}</p><span style="font-size:10px;opacity:0.4">${c.paginas.length} págs</span></div></div>`;});
}
function guardarComicFinal(){
  const titulo=document.getElementById('tituloInput').value.trim()||'Sin título';
  if(!tempPortada){ alert('Agrega portada primero'); mostrarTab('portada'); return; }
  comics.push({titulo,portada:tempPortada,paginas:[...tempPaginas]});
  localStorage.setItem('misComics',JSON.stringify(comics));
  // reset
  tempPortada=null; tempPaginas=[];
  document.getElementById('tituloInput').value='';
  document.getElementById('framePortada').innerHTML=`<div style="text-align:center"><div class="plus">+</div><span class="steamLabel">AGREGAR PORTADA<br>ABAJO</span></div>`;
  document.getElementById('previewTitulo').innerText='SIN TÍTULO';
  cerrarModalComic(); renderComics();
}
function abrirComic(i){
  const c=comics[i];
  let h=`<div id="visorLectura" style="position:fixed;inset:0;background:#000;z-index:1000005;overflow-y:auto;padding:20px"><div style="display:flex;justify-content:space-between;position:sticky;top:0;background:#000;padding:10px 0"><h2>${c.titulo}</h2><button onclick="document.getElementById('visorLectura').remove()" class="btn" style="width:auto">X</button></div>`;
  c.paginas.forEach(p=>h+=`<img src="${p}" style="width:100%;max-width:700px;display:block;margin:10px auto;border-radius:8px">`);
  h+=`<button class="btn" style="background:red;margin-top:20px" onclick="if(confirm('¿Borrar?')){comics.splice(${i},1);localStorage.setItem('misComics',JSON.stringify(comics));document.getElementById('visorLectura').remove();renderComics();}">Borrar cómic</button></div>`;
  document.body.insertAdjacentHTML('beforeend',h);
}
renderComics();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMICS</title>
<style>
body{margin:0;background:#0e0e0e;color:white;font-family:Arial, sans-serif}
header{padding:15px;text-align:center;background:#1a1a1a}
header a{color:white;text-decoration:none;font-size:20px;font-weight:bold}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:20px}
.comic{background:#1e1e1e;border-radius:10px;overflow:hidden}
.comic img{width:100%;height:250px;object-fit:cover;display:block}
.comic h3{padding:10px;margin:0;font-size:14px;text-align:center}
#adminPanel{display:none;padding:20px;background:#222;margin:20px;border-radius:10px;border:1px dashed #555}
#adminPanel input, #adminPanel button{width:100%;padding:10px;margin-top:10px;border-radius:5px;border:none}
#adminPanel button{background:#e50914;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><a href="../../">← Volver a Series</a></header>

<!-- PANEL ADMIN OCULTO -->
<div id="adminPanel">
  <h2>Panel Admin (Solo tú)</h2>
  <input id="titulo" type="text" placeholder="Titulo del comic">
  <input id="imagen" type="text" placeholder="URL de imagen o /public/comics/img.jpg">
  <button onclick="agregarComic()">Agregar Comic</button>
</div>

<div id="grid"></div>

<script>
const ADMIN_PASS = "whisky123";
const params = new URLSearchParams(window.location.search);
const esAdmin = params.get('admin') === ADMIN_PASS;

if(esAdmin){
  document.getElementById('adminPanel').style.display = 'block';
}

let comics = JSON.parse(localStorage.getItem('mis_comics') || '[]');

function mostrar(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(comics.length === 0){
    grid.innerHTML = '<p style="padding:20px;opacity:.6">Aún no hay cómics</p>';
    return;
  }
  comics.forEach(c=>{
    grid.innerHTML += `<div class="comic"><img src="${c.img}"><h3>${c.titulo}</h3></div>`;
  });
}

function agregarComic(){
  const t = document.getElementById('titulo').value;
  const i = document.getElementById('imagen').value;
  if(!t || !i) return alert('Llena todo');
  comics.push({titulo:t, img:i});
  localStorage.setItem('mis_comics', JSON.stringify(comics));
  document.getElementById('titulo').value = '';
  document.getElementById('imagen').value = '';
  mostrar();
}

mostrar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÓMICS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:white; font-family:Arial; min-height:100vh; padding:20px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.btn-volver { background:#ff0033; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; }
.btn-x { background:transparent; border:2px solid white; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:20px; }
#overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9998; }
#adminPanel { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#222; padding:25px; border-radius:15px; z-index:9999; width:90%; max-width:400px; border:2px solid #ff0033; }
#adminPanel input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:none; }
#adminPanel button { width:100%; padding:12px; background:#ff0033; color:white; border:none; border-radius:8px; margin-top:10px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>

<div class="header">
<button class="btn-volver" onclick="goHome()">← Volver</button>
<button class="btn-x" onclick="goHome()">X</button>
</div>

<div id="grid"></div>

<div id="overlay" onclick="cerrarPanel()"></div>
<div id="adminPanel">
<h2 style="text-align:center;">Agregar Cómic</h2>
<input id="tituloComic" placeholder="Título">
<input id="imgComic" placeholder="Link imagen">
<input id="linkComic" placeholder="Link cómic">
<button onclick="agregarComic()">Agregar Nuevo Cómic</button>
<button onclick="cerrarPanel()" style="background:#444;">Cerrar</button>
</div>

<script>
let comics = JSON.parse(localStorage.getItem('misComics')) || [];
function goHome(){ window.location.href = "../index.html"; }
function render(){
 const grid = document.getElementById('grid');
 grid.innerHTML = comics.map(c=>`<div style="background:#1a1a1a;padding:10px;margin:10px;border-radius:10px;"><img src="${c.img}" style="width:100%;height:250px;object-fit:cover;"><h3>${c.titulo}</h3></div>`).join('');
}
function agregarComic(){
 const t=tituloComic.value, i=imgComic.value, l=linkComic.value;
 if(!t||!i) return alert('Falta dato');
 comics.push({titulo:t,img:i,link:l});
 localStorage.setItem('misComics',JSON.stringify(comics));
 cerrarPanel(); render();
}
function abrirPanel(){ adminPanel.style.display='block'; overlay.style.display='block'; }
function cerrarPanel(){ adminPanel.style.display='none'; overlay.style.display='none'; }
let countE=0,lastTime=0;
document.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='e'){
   let now=Date.now();
   if(now-lastTime>800) countE=0;
   countE++; lastTime=now;
   if(countE===3){ abrirPanel(); countE=0; }
 }
});
render();
</script>
</body>
</html>

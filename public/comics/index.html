<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comics Whisky</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
<style>
  body { background: #0a0a0a; color: white; font-family: sans-serif; }
</style>
</head>
<body class="p-4">

<h1 class="text-3xl font-bold text-center mb-6">COMICS WHISKY 🔥</h1>

<!-- PANEL ADMIN -->
<div id="adminLogin" class="max-w-md mx-auto mb-8 p-4 bg-zinc-900 rounded-xl">
  <h2 class="font-bold mb-2">Panel Admin (solo tú)</h2>
  <input id="adminPass" type="password" placeholder="Contraseña: whisky123" class="w-full p-2 rounded bg-black mb-2">
  <button onclick="loginAdmin()" class="w-full bg-white text-black p-2 rounded font-bold">Entrar</button>
  <div id="adminPanel" class="hidden mt-4">
    <input id="comicTitle" placeholder="Título del comic" class="w-full p-2 rounded bg-black mb-2">
    <input id="comicImage" placeholder="Link de imagen (imgur, etc)" class="w-full p-2 rounded bg-black mb-2">
    <input id="comicLink" placeholder="Link para leer / descargar" class="w-full p-2 rounded bg-black mb-2">
    <button onclick="subirComic()" class="w-full bg-yellow-400 text-black p-2 rounded font-bold">SUBIR COMIC</button>
  </div>
</div>

<!-- GRID PUBLICO -->
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-6xl mx-auto">
  <p class="col-span-full text-center opacity-50">Cargando comics...</p>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyBXMgNxrFXyT6MUdRJ03u496iAMpx4mwP8",
  authDomain: "comics-whisky.firebaseapp.com",
  projectId: "comics-whisky",
  storageBucket: "comics-whisky.firebasestorage.app",
  messagingSenderId: "418946277283",
  appId: "1:418946277283:web:77427c48417c1bfdfe4416",
  measurementId: "G-R20EFY1CGB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const comicsRef = collection(db, "comics");

let isAdmin = false;
window.loginAdmin = () => {
  if(document.getElementById('adminPass').value === 'whisky123'){
    isAdmin = true;
    document.getElementById('adminPanel').classList.remove('hidden');
    alert('Admin activado');
  } else { alert('Contraseña incorrecta'); }
}

window.subirComic = async () => {
  const title = document.getElementById('comicTitle').value;
  const image = document.getElementById('comicImage').value;
  const link = document.getElementById('comicLink').value;
  if(!title || !image) return alert('Falta título o imagen');
  await addDoc(comicsRef, { title, image, link, createdAt: serverTimestamp() });
  document.getElementById('comicTitle').value = ''; document.getElementById('comicImage').value = ''; document.getElementById('comicLink').value = '';
}

window.borrarComic = async (id) => {
  if(!isAdmin) return alert('Solo admin puede borrar');
  if(confirm('¿Borrar este comic?')) await deleteDoc(doc(db, "comics", id));
}

// TIEMPO REAL - TODOS VEN LO MISMO
const q = query(comicsRef, orderBy("createdAt", "desc"));
onSnapshot(q, (snap) => {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(snap.empty) grid.innerHTML = '<p class="col-span-full text-center opacity-50">Aún no hay comics, ¡sé el primero!</p>';
  snap.forEach(d => {
    const c = d.data();
    grid.innerHTML += `
      <div class="bg-zinc-900 rounded-xl overflow-hidden">
        <img src="${c.image}" class="w-full h-64 object-cover">
        <div class="p-3">
          <h3 class="font-bold">${c.title}</h3>
          ${c.link ? `<a href="${c.link}" target="_blank" class="text-yellow-400 text-sm underline">Leer</a>` : ''}
          ${isAdmin ? `<button onclick="borrarComic('${d.id}')" class="block mt-2 text-xs bg-red-600 px-2 py-1 rounded">Borrar</button>` : ''}
        </div>
      </div>
    `;
  });
});
</script>
</body>
</html>

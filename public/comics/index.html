<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
  #topBar{height:50px;background:#000;display:flex;align-items:center;padding:0 15px;border-bottom:2px solid #222;letter-spacing:2px;font-size:14px}
  #contenido{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
  #closeX{position:fixed;top:6px;right:12px;z-index:99999;width:40px;height:40px;border-radius:50%;background:#000;color:#fff;border:2px solid #fff;cursor:pointer;font-weight:bold;font-size:18px}
  #adminDot{position:fixed;top:6px;right:62px;z-index:99999;width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;cursor:pointer;background:#111}

  /* STEAM LIBRARY CARDS */
 .comicItem{position:relative;border-radius:8px;overflow:hidden;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:transform 0.15s}
 .comicItem:hover{transform:scale(1.04);border-color:#fff;box-shadow:0 0 25px rgba(255,255,255,0.35);z-index:2}
 .comicItem img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
 .comicInfo{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.95));padding:30px 10px 10px}
 .comicInfo p{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .comicInfo span{font-size:10px;opacity:0.5}

  #cropModal,#loginModal,#menuPerfil,#modalComic{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000000;display:none;align-items:center;justify-content:center}
  #cropArea{width:320px;height:320px;background:#888;position:relative;overflow:hidden;border-radius:16px}
  #cropImage{position:absolute;top:0;left:0;cursor:grab;will-change:transform}
  #cropCircle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,0.6);pointer-events:none}

  #loginBox,#menuBox{background:#161616;border:1px solid #333;border-radius:16px;padding:22px;width:90%;max-width:320px;text-align:center}

  /* EDITOR STEAM - AHORA RAPIDO */
  #modalComicBox{background:#181818;border:1px solid #2a2a2a;border-radius:12px;width:95%;max-width:820px;height:78vh;display:flex;overflow:hidden;position:relative}
 .leftPreview{flex:1;background:#101010;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
 .rightControls{position:absolute;top:12px;right:12px;width:210px;display:flex;flex-direction:column;gap:10px}
 .steamFrame{width:200px;height:300px;border:1px solid #333;background:#151515;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
 .steamFrame:hover{border-color:#fff;box-shadow:0 0 18px #fff}
 .steamFrame img{width:100%;height:100%;object-fit:cover}
 .plus{font-size:40px;opacity:0.3}.steamFrame:hover.plus{opacity:1;color:#fff}
 .controlBtn{background:#202020;border:1px solid #333;color:#888;padding:10px;border-radius:6px;cursor:pointer;text-align:left;transition:0.1s}
 .controlBtn:hover,.controlBtn.active{border-color:#fff;color:#fff;background:#2a2a2a}
  #tituloInput{background:#101010;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;width:100%;box-sizing:border-box}
  #galeriaPaginas{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px;overflow-y:auto;max-height:320px;width:100%;padding:5px}
 .paginaThumb{width:100px;height:140px;border:1px solid #333;border-radius:6px;overflow:hidden;position:relative;background:#151515}
 .paginaThumb img{width:100%;height:100%;object-fit:cover}
 .addPageCard{width:100px;height:140px;border:1px dashed #444;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#151515}
 .addPageCard:hover{border-color:#fff}
 .btn{width:100%;padding:11px;border-radius:8px;border:1px solid #fff;background:#000;color:#fff;cursor:pointer;font-weight:bold}
  #btnGuardar{position:relative;z-index:10;background:#fff;color:#000}
  #btnGuardar:active{transform:scale(0.97)}
</style>
</head>
<body>
<button id="closeX" onclick="cerrarComics()">X</button>
<img id="adminDot" onclick="clickPerfil()">
<div id="topBar">BIBLIOTECA</div>
<div id="contenido"></div>

<div id="cropModal"><div id="cropArea"><img id="cropImage"><div id="cropCircle"></div></div><div style="width:320px;margin-top:10px"><input type="range" id="zoom" style="width:100%"><input type="file" id="fileInput" accept="image/*" style="display:none"><button class="btn" onclick="fileInput.click()">Elegir</button><button class="btn" onclick="guardarRecorte()">Guardar</button><button class="btn" onclick="cerrarEditor()">Cerrar</button></div><canvas id="canvas" width="400" height="400" style="display:none"></canvas></div>
<div id="loginModal" onclick="if(event.target==this)cerrarLogin()"><div id="loginBox"><h3>Admin</h3><input id="emailLogin" value="lxvtorres@gmail.com" readonly style="width:100%;padding:10px;background:#000;border:1px solid #444;color:#fff;border-radius:8px;margin-top:8px"><input id="passLogin" type="password" placeholder="Contraseña" style="width:100%;padding:10px;background:#000;border:1px solid #444;color:#fff;border-radius:8px;margin-top:8px"><button class="btn" onclick="intentarLogin()">Entrar</button><p id="loginError" style="color:red;display:none">Incorrecta</p></div></div>
<div id="menuPerfil" onclick="if(event.target==this)cerrarMenu()"><div id="menuBox"><img id="menuFoto" style="width:70px;height:70px;border-radius:50%;border:2px solid #fff"><h3>Perfil</h3><button class="btn" onclick="abrirEditor();cerrarMenu()">Editar foto</button><button class="btn" onclick="abrirModalComic();cerrarMenu()">Agregar cómic</button><button class="btn" style="background:#222" onclick="cerrarSesionAdmin()">Cerrar sesión</button><button class="btn" style="opacity:0.5" onclick="cerrarMenu()">Cancelar</button></div></div>

<div id="modalComic" onclick="if(event.target==this)cerrarModalComic()">
<div id="modalComicBox">
  <div class="leftPreview">
    <div id="portadaView" style="display:flex;flex-direction:column;align-items:center"><div class="steamFrame" id="framePortada" onclick="inputPortada.click()"><div style="text-align:center"><div class="plus">+</div><div style="font-size:10px;opacity:0.5">AGREGAR PORTADA</div></div></div><p id="previewTitulo" style="margin-top:12px;opacity:0.5;font-size:12px">SIN TITULO</p></div>
    <div id="paginasView" style="display:none;flex-direction:column;width:100%"><h4 style="opacity:0.5;margin:0 0 10px">PÁGINAS</h4><div id="galeriaPaginas"></div></div>
  </div>
  <div class="rightControls">
    <div style="display:flex;justify-content:space-between"><span style="font-size:10px;opacity:0.5">NUEVO</span><span onclick="cerrarModalComic()" style="cursor:pointer">✕</span></div>
    <div><label style="font-size:10px;opacity:0.5">TITULO:</label><input id="tituloInput" oninput="previewTitulo.innerText=this.value.toUpperCase()||'SIN TITULO'"></div>
    <button class="controlBtn active" id="btnPortada" onclick="mostrarTab('portada')">PORTADA</button>
    <button class="controlBtn" id="btnPaginas" onclick="mostrarTab('paginas')">PAGINAS</button>
    <button class="btn" id="btnGuardar" type="button" onclick="guardarComicFinal()">GUARDAR CÓMIC</button>
    <button class="btn" style="opacity:0.4" type="button" onclick="cerrarModalComic()">CANCELAR</button>
  </div>
</div>
</div>

<input type="file" id="inputPortada" accept="image/*" style="display:none">
<input type="file" id="inputPagina" accept="image/*" multiple style="display:none">

<script>
const ADMIN_EMAIL="lxvtorres@gmail.com";
const adminDot=document.getElementById('adminDot');
adminDot.src=localStorage.getItem('adminPerfilComics')||'https://i.imgur.com/8Km9tLL.png';
function cerrarComics(){ window.parent.postMessage("CERRAR_COMICS","*"); try{const v=window.parent.document.getElementById("visorComics"); if(v) v.remove();}catch(e){} }

let eCount=0,eTimer=null;
window.addEventListener('keydown',ev=>{ if(ev.key.toLowerCase()==='e'){ eCount++; clearTimeout(eTimer); eTimer=setTimeout(()=>eCount=0,800); if(eCount===3){eCount=0;clickPerfil();}}});
function clickPerfil(){ if(localStorage.getItem('sesionAdmin')!=='true'){loginModal.style.display='flex';} else {menuFoto.src=adminDot.src;menuPerfil.style.display='flex';}}
function cerrarMenu(){menuPerfil.style.display='none';} function cerrarLogin(){loginModal.style.display='none';}
function intentarLogin(){const p=passLogin.value.trim(); if(!p)return; let s=localStorage.getItem('adminPass'); if(!s){localStorage.setItem('adminPass',p);s=p;} if(p===s && emailLogin.value.toLowerCase()===ADMIN_EMAIL){localStorage.setItem('sesionAdmin','true');cerrarLogin();} else loginError.style.display='block';}
function cerrarSesionAdmin(){localStorage.removeItem('sesionAdmin');cerrarMenu();}

// FOTO
let pos={x:0,y:0,scale:0.2,sx:0,sy:0,drag:false}; zoom.min=0.05; zoom.max=1.2; zoom.step=0.005;
function abrirEditor(){cropModal.style.display='flex';cropImage.src=adminDot.src;setTimeout(centerImage,80);}
function cerrarEditor(){cropModal.style.display='none';}
function centerImage(){pos.scale=0.2;zoom.value=0.2;const w=cropImage.naturalWidth*pos.scale,h=cropImage.naturalHeight*pos.scale;pos.x=(cropArea.clientWidth-w)/2;pos.y=(cropArea.clientHeight-h)/2;update();}
function update(){cropImage.style.transform=`translate3d(${pos.x}px, ${pos.y}px, 0) scale(${pos.scale})`;}
fileInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{cropImage.src=ev.target.result;cropImage.onload=centerImage};r.readAsDataURL(f);};
zoom.oninput=()=>{pos.scale=parseFloat(zoom.value);update();};
cropImage.addEventListener('mousedown',e=>{pos.drag=true;pos.sx=e.clientX-pos.x;pos.sy=e.clientY-pos.y;});
window.addEventListener('mousemove',e=>{if(!pos.drag)return;pos.x=e.clientX-pos.sx;pos.y=e.clientY-pos.sy;update();});
window.addEventListener('mouseup',()=>pos.drag=false);

// LOGICA COMIC
let tempPortada=null,tempPaginas=[];
const inputPortada=document.getElementById('inputPortada'),inputPagina=document.getElementById('inputPagina');
function abrirModalComic(){modalComic.style.display='flex';mostrarTab('portada');}
function cerrarModalComic(){modalComic.style.display='none';}
function mostrarTab(t){
  portadaView.style.display=t==='portada'?'flex':'none';
  paginasView.style.display=t==='paginas'?'flex':'none';
  btnPortada.classList.toggle('active',t==='portada');
  btnPaginas.classList.toggle('active',t==='paginas');
  if(t==='paginas') renderGaleria();
}
inputPortada.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=ev=>{tempPortada=ev.target.result;framePortada.innerHTML=`<img src="${tempPortada}">`;}; r.readAsDataURL(f);
});
inputPagina.addEventListener('change',e=>{
  const files=Array.from(e.target.files); let c=0;
  files.forEach(f=>{const r=new FileReader(); r.onload=ev=>{tempPaginas.push(ev.target.result); c++; if(c===files.length) renderGaleria();}; r.readAsDataURL(f);});
});
function renderGaleria(){
  const g=document.getElementById('galeriaPaginas'); g.innerHTML='';
  tempPaginas.forEach((src,i)=>{
    g.innerHTML+=`<div class="paginaThumb"><img src="${src}"><div onclick="tempPaginas.splice(${i},1);renderGaleria()" style="position:absolute;top:2px;right:2px;background:#000;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer">x</div></div>`;
  });
  g.innerHTML+=`<div class="addPageCard" onclick="inputPagina.click()"><div class="plus" style="font-size:28px">+</div><div style="font-size:9px;opacity:0.5">AGREGAR</div></div>`;
}
let comics=JSON.parse(localStorage.getItem('misComics')||'[]');
function renderComics(){
  const cont=document.getElementById('contenido');
  cont.innerHTML=comics.length?'':'<p style="opacity:0.3;grid-column:1/-1">Biblioteca vacía. EEE para admin</p>';
  // ORGANIZADO TIPO STEAM - ULTIMOS PRIMERO
  [...comics].reverse().forEach((c,idx)=>{
    const realIndex=comics.length-1-idx;
    cont.innerHTML+=`<div class="comicItem" onclick="abrirComic(${realIndex})"><img src="${c.portada}"><div class="comicInfo"><p>${c.titulo}</p><span>${c.paginas.length} págs</span></div></div>`;
  });
}

// ESTA ES LA FUNCION QUE FALLABA - AHORA ES GLOBAL Y SIMPLE
window.guardarComicFinal=function(){
  const titulo=document.getElementById('tituloInput').value.trim()||'Sin título';
  if(!tempPortada){ alert('Pon portada'); mostrarTab('portada'); return; }
  console.log('guardando',titulo,tempPortada.length,tempPaginas.length);
  comics.push({titulo,portada:tempPortada,paginas:[...tempPaginas]});
  localStorage.setItem('misComics',JSON.stringify(comics));
  tempPortada=null; tempPaginas=[]; tituloInput.value=''; previewTitulo.innerText='SIN TITULO';
  framePortada.innerHTML=`<div style="text-align:center"><div class="plus">+</div><div style="font-size:10px;opacity:0.5">AGREGAR PORTADA</div></div>`;
  cerrarModalComic(); renderComics();
};

function abrirComic(i){
  const c=comics[i];
  let h=`<div id="visorLectura" style="position:fixed;inset:0;background:#0a0a0a;z-index:1000005;overflow-y:auto;padding:20px"><div style="display:flex;justify-content:space-between;position:sticky;top:0;background:#0a0a0a;padding:10px 0;z-index:2"><h2>${c.titulo}</h2><button onclick="document.getElementById('visorLectura').remove()" class="btn" style="width:auto">X</button></div>`;
  c.paginas.forEach(p=>h+=`<img src="${p}" style="width:100%;max-width:720px;display:block;margin:12px auto;border-radius:8px">`);
  h+=`<button class="btn" style="background:#ff1a1a;margin:20px auto;display:block;max-width:300px" onclick="if(confirm('¿Borrar cómic?')){comics.splice(${i},1);localStorage.setItem('misComics',JSON.stringify(comics));document.getElementById('visorLectura').remove();renderComics();}">BORRAR CÓMIC</button></div>`;
  document.body.insertAdjacentHTML('beforeend',h);
}
renderComics();
</script>
</body>
</html>

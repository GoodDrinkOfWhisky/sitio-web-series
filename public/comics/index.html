<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0e0e10;color:white;padding:80px 20px}
.top-bar{position:fixed;top:0;left:0;width:100%;height:70px;display:flex;justify-content:flex-end;align-items:center;padding:0 20px;gap:18px;background:rgba(14,14,16,0.8);backdrop-filter:blur(12px);z-index:1000}
.profile-circle{width:42px;height:42px;border-radius:50%;background:#2a2a2e;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid white;box-shadow:0 0 12px rgba(255,255,255,0.7);overflow:hidden;transition:0.2s}
.profile-circle img{width:100%;height:100%;object-fit:cover}
.profile-circle svg{fill:#aaa;width:24px;height:24px}
.close-btn{width:42px;height:42px;border-radius:50%;border:2px solid white;background:rgba(0,0,0,0.4);color:white;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 12px rgba(255,255,255,0.5)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.active{display:flex}
.login-box{background:rgba(28,28,30,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:30px 25px;width:90%;max-width:340px}
.login-box input{width:100%;padding:12px 14px;margin-bottom:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.4);color:white;outline:none}
.login-box button{width:100%;padding:12px;border-radius:10px;border:none;background:white;color:black;font-weight:600;cursor:pointer}

/* EDITOR FOTO CIRCULAR */
#cropModal{background:#2e2e30}
.crop-wrapper{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.crop-circle-viewport{
  width:300px;height:300px;border-radius:50%;overflow:hidden;
  position:relative;background:#1a1a1a;
  box-shadow:0 0 0 4000px rgba(0,0,0,0.6); /* fondo gris oscurecido */
  border:3px solid white;
}
.crop-circle-viewport img{position:absolute;top:0;left:0;max-width:none;user-select:none;cursor:grab}
.crop-controls{display:flex;gap:10px;align-items:center}
.crop-controls input[type=range]{width:200px}
</style>
</head>
<body>

<div class="top-bar">
  <div class="profile-circle" id="profileBtn"></div>
  <a href="../index.html" class="close-btn">✕</a>
</div>

<h2>CÓMICS</h2>
<div id="lista-comics"></div>

<!-- LOGIN -->
<div class="modal-overlay" id="loginModal">
  <div class="login-box">
    <h3 style="text-align:center;margin-bottom:15px">Admin</h3>
    <input type="email" id="emailInput" placeholder="lxvtorres@gmail.com">
    <input type="password" id="passInput" placeholder="Contraseña">
    <button id="loginBtn">Entrar</button>
    <p style="font-size:11px;color:#888;text-align:center;margin-top:10px" id="userStatus"></p>
  </div>
</div>

<!-- OPCIONES PERFIL ADMIN -->
<div class="modal-overlay" id="profileOptions">
  <div class="login-box" style="text-align:center">
    <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 15px;overflow:hidden;border:2px solid white" id="previewBig"></div>
    <button onclick="document.getElementById('fileInput').click()" style="margin-bottom:8px">Agregar / Cambiar foto</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button onclick="cerrarSesion()" style="background:rgba(255,0,0,0.15);color:#ff6b6b;border:1px solid rgba(255,0,0,0.3)">Cerrar sesión</button>
    <button onclick="document.getElementById('profileOptions').classList.remove('active')" style="background:transparent;color:white;border:1px solid rgba(255,255,255,0.2);margin-top:8px">Cancelar</button>
  </div>
</div>

<!-- CROP CIRCULAR -->
<div class="modal-overlay" id="cropModal">
  <div class="crop-wrapper">
    <div class="crop-circle-viewport" id="cropViewport">
      <img id="cropImage">
    </div>
    <div class="crop-controls">
      <span style="font-size:12px">Zoom</span>
      <input type="range" id="zoomRange" min="0.5" max="3" step="0.01" value="1">
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="guardarFotoRecortada()" style="padding:10px 20px;border-radius:20px;border:none;background:white;color:black;font-weight:600">Guardar</button>
      <button onclick="document.getElementById('cropModal').classList.remove('active')" style="padding:10px 20px;border-radius:20px;border:1px solid white;background:transparent;color:white">Cancelar</button>
    </div>
  </div>
</div>

<script>
const ADMIN_EMAIL="lxvtorres@gmail.com";
let userEmail=localStorage.getItem("userEmail")||"";
let profilePic=localStorage.getItem("adminProfilePic")||"";
const profileBtn=document.getElementById("profileBtn");

function renderProfileIcon(){
  if(profilePic){
    profileBtn.innerHTML=`<img src="${profilePic}">`;
    document.getElementById("previewBig").innerHTML=`<img src="${profilePic}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    profileBtn.innerHTML=`<svg viewBox="0 0 24 24"><path fill="#aaa" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
    document.getElementById("previewBig").innerHTML=profileBtn.innerHTML;
  }
  document.getElementById("userStatus").innerText=userEmail?`Guardado en este dispositivo: ${userEmail}`:"";
}
renderProfileIcon();

// CLICK PERFIL
profileBtn.onclick=()=>{
  if(userEmail.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    document.getElementById("loginModal").classList.add("active");
  } else {
    document.getElementById("profileOptions").classList.add("active");
  }
}
document.getElementById("loginModal").onclick=e=>{if(e.target.id==="loginModal")e.currentTarget.classList.remove("active")}
document.getElementById("profileOptions").onclick=e=>{if(e.target.id==="profileOptions")e.currentTarget.classList.remove("active")}

document.getElementById("loginBtn").onclick=()=>{
  const em=document.getElementById("emailInput").value.trim().toLowerCase();
  if(em!==ADMIN_EMAIL){alert("Solo lxvtorres@gmail.com puede ser admin");return}
  userEmail=em; localStorage.setItem("userEmail",userEmail);
  document.getElementById("loginModal").classList.remove("active");
  renderProfileIcon(); alert("Sesión guardada solo en TU dispositivo");
}

function cerrarSesion(){userEmail="";localStorage.removeItem("userEmail");document.getElementById("profileOptions").classList.remove("active");renderProfileIcon();}

// --- LOGICA RECORTE CIRCULAR ---
let scale=1,posX=0,posY=0,isDrag=false,startX,startY;
const cropImg=document.getElementById("cropImage");
const viewport=document.getElementById("cropViewport");

document.getElementById("fileInput").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  cropImg.src=url; scale=1; posX=0; posY=0;
  document.getElementById("zoomRange").value=1;
  document.getElementById("profileOptions").classList.remove("active");
  document.getElementById("cropModal").classList.add("active");
  cropImg.onload=()=>updateTransform();
}

function updateTransform(){cropImg.style.transform=`translate(${posX}px, ${posY}px) scale(${scale})`;}
document.getElementById("zoomRange").oninput=e=>{scale=parseFloat(e.target.value);updateTransform();}

// Drag
cropImg.addEventListener("mousedown", e=>{isDrag=true;startX=e.clientX-posX;startY=e.clientY-posY;cropImg.style.cursor="grabbing"});
window.addEventListener("mousemove", e=>{if(!isDrag)return;posX=e.clientX-startX;posY=e.clientY-startY;updateTransform();});
window.addEventListener("mouseup", ()=>{isDrag=false;cropImg.style.cursor="grab"});
// Touch
cropImg.addEventListener("touchstart", e=>{isDrag=true;startX=e.touches[0].clientX-posX;startY=e.touches[0].clientY-posY;},{passive:false});
window.addEventListener("touchmove", e=>{if(!isDrag)return;posX=e.touches[0].clientX-startX;posY=e.touches[0].clientY-startY;updateTransform();},{passive:false});
window.addEventListener("touchend", ()=>isDrag=false);

function guardarFotoRecortada(){
  const canvas=document.createElement("canvas");
  canvas.width=300;canvas.height=300;
  const ctx=canvas.getContext("2d");
  ctx.beginPath();ctx.arc(150,150,150,0,Math.PI*2);ctx.clip();
  // Calcular posición real
  const imgRect=cropImg.getBoundingClientRect();
  const vpRect=viewport.getBoundingClientRect();
  const tempCanvas=document.createElement("canvas");
  // Dibujo simplificado: usamos el transform actual
  ctx.drawImage(cropImg, posX + (300 - cropImg.width*scale)/2 + 150, posY + (300 - cropImg.height*scale)/2 + 150, cropImg.naturalWidth*scale, cropImg.naturalHeight*scale);
  // fallback más simple y preciso: renderizamos como se ve
  const finalCanvas=document.createElement("canvas");
  finalCanvas.width=300;finalCanvas.height=300;
  const fctx=finalCanvas.getContext("2d");
  fctx.beginPath();fctx.arc(150,150,150,0,Math.PI*2);fctx.clip();
  fctx.drawImage(cropImg, 0,0, 300,300); // truco visual directo del viewport

  // método correcto: tomar screenshot del viewport con canvas
  html2canvasLike();
}

function html2canvasLike(){
  const size=300;
  const canvas=document.createElement("canvas");
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext("2d");
  ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();
  const imgW=cropImg.naturalWidth*scale;
  const imgH=cropImg.naturalHeight*scale;
  const offsetX=posX + (size - cropImg.getBoundingClientRect().width)/2 + 0;
  const offsetY=posY + (size - cropImg.getBoundingClientRect().height)/2 + 0;
  // Dibuja centrado con drag
  ctx.drawImage(cropImg, offsetX + size/2 - imgW/2, offsetY + size/2 - imgH/2, imgW, imgH);
  const dataURL=canvas.toDataURL("image/png");
  localStorage.setItem("adminProfilePic",dataURL);
  profilePic=dataURL; renderProfileIcon();
  document.getElementById("cropModal").classList.remove("active");
}
</script>
</body>
</html>
